  /* Slide 3 */
  .def{font-size:clamp(1.1rem,2.1vw,1.7rem);line-height:1.5;background:#fff;border-radius:14px;padding:18px 22px;border:2px solid var(--line)}
  .points{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
  .point{border-radius:12px;padding:12px 14px;border:2px solid;cursor:pointer;transition:transform .15s}
  .point:hover{transform:translateY(-2px)}
  .point .hide{display:none;margin-top:6px;color:var(--ink)}
  .point.open .hide{display:block}
  .p1{border-color:var(--good);background:var(--good-bg)} .p2{border-color:var(--blue);background:var(--blue-bg)}
  .p3{border-color:var(--warn);background:var(--warn-bg)} .p4{border-color:var(--bad);background:var(--bad-bg)}

  /* Slide 4: TSP lab */
  canvas{width:auto;max-width:100%;max-height:18vh;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:14px;display:block}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  table{border-collapse:collapse;width:100%;font-size:clamp(.8rem,1.2vw,1rem)}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600}
  .sw{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
  .msg{background:#fff;border-radius:12px;padding:10px 12px;border:2px dashed var(--maroon2);margin-top:8px;font-size:clamp(.8rem,1.2vw,1rem)}

  /* Slide 5 + 6: flip cards */
  .flip{perspective:900px;cursor:pointer;min-height:150px}
  .flip .inner{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
  .flip.open .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center}
  .front{background:var(--maroon);color:#fff;text-align:center}
  .front .ico{font-size:2rem}
  .back{background:#fff;border:2px solid var(--maroon);transform:rotateY(180deg)}
  .back p{margin:.2em 0;font-size:clamp(.8rem,1.15vw,1rem)}

  /* Slide 7 */
  textarea{width:100%;flex:1;min-height:110px;font:inherit;font-size:clamp(.9rem,1.3vw,1.1rem);border:2px solid var(--line);border-radius:12px;padding:10px}
  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:clamp(.85rem,1.25vw,1.05rem)}
  .check input{width:20px;height:20px;accent-color:var(--good);margin-top:3px}
  .score{font-size:clamp(1.2rem,2.2vw,1.8rem);font-weight:700;color:var(--good);margin-top:8px}
  .model{display:none;background:var(--good-bg);border:2px solid var(--good);border-radius:12px;padding:12px;margin-top:8px}
  .model.show{display:block}

  /* ---------- High contrast mode (for visual impairment) ---------- */
  body.hc{background:#000}
  body.hc .slide{background:#000;color:#fff;border:3px solid #fff}
  body.hc .slide h1, body.hc .slide h2, body.hc .satnav h2{color:#fff}
  body.hc .kicker{background:#ffd400;color:#000}
  body.hc .card, body.hc .def, body.hc .question, body.hc .msg, body.hc .note, body.hc .sat, body.hc .satnav,
  body.hc .loop, body.hc .point, body.hc .back, body.hc textarea{background:#000 !important;color:#fff !important;border:3px solid #fff !important}
  body.hc .point .hide, body.hc td, body.hc th{color:#fff}
  body.hc .front{background:#000;border:3px solid #ffd400;color:#fff}
  body.hc .hl{background:#ffd400;color:#000}
  body.hc .bigstat, body.hc .formula-big, body.hc .score{color:#ffd400}
  body.hc .decode .card b{color:#ffd400}
  body.hc button.btn{background:#000;color:#fff;border:3px solid #fff}
  body.hc button.btn.solid{background:#ffd400;color:#000;border-color:#ffd400}
  body.hc canvas{background:#000;border:3px solid #fff}
  body.hc .timebar{background:#333}
  body.hc .model{background:#000;color:#fff;border:3px solid #00e676}
  body.hc .loop svg circle{fill:#fff} body.hc .loop svg text{fill:#000}
  body.hc .loop polyline{stroke-width:7}
  body.hc .loop.p0{border-color:#4da3ff !important} body.hc .loop.p0 polyline{stroke:#4da3ff}
  body.hc .loop.p1{border-color:#ffb000 !important} body.hc .loop.p1 polyline{stroke:#ffb000}
  body.hc .loop.p2{border-color:#00e676 !important} body.hc .loop.p2 polyline{stroke:#00e676}
  body.hc .loop.p0 small, body.hc .loop.p1 small, body.hc .loop.p2 small{font-weight:700}
  body.hc .step{opacity:.55} body.hc .step.on{opacity:1;border-color:#ffd400 !important}
  body.hc .nav{background:#000;border:3px solid #fff} body.hc .nav span{color:#fff}
  body.hc .nav button{background:#ffd400;color:#000}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;stage&quot;&gt;

&lt;!-- ============ 1. The question ============ --&gt;
&lt;section class=&quot;slide active&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Exam question&lt;/span&gt;
  &lt;h1&gt;Solving the &quot;unsolvable&quot;?&lt;/h1&gt;
  &lt;div class=&quot;question&quot;&gt;&quot;What approach might a programmer take if asked to &#x27;solve&#x27; an intractable problem?&quot;&lt;/div&gt;
  &lt;p&gt;Notice the quotation marks around &lt;b&gt;&#x27;solve&#x27;&lt;/b&gt;. That&#x27;s the examiner&#x27;s hint: we &lt;b&gt;can&#x27;t&lt;/b&gt; truly solve it in a reasonable time, so what can we do instead?&lt;/p&gt;
  &lt;div class=&quot;decode&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Intractable&lt;/b&gt;&lt;br&gt;Solvable in theory, but &lt;b&gt;not in polynomial time&lt;/b&gt;. Fine for tiny inputs, hopeless for big ones.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;&quot;What approach…&quot;&lt;/b&gt;&lt;br&gt;Name the approach &lt;b&gt;and&lt;/b&gt; describe what it does. One word isn&#x27;t enough.&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;b&gt;Our goal today&lt;/b&gt;&lt;br&gt;Understand every marking point, then write a full-mark answer.&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 2. Counting routes: (n-1)! / 2 ============ --&gt;
&lt;section class=&quot;slide&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Counting the routes&lt;/span&gt;
  &lt;h1 style=&quot;margin-bottom:.2em&quot;&gt;Why &lt;span class=&quot;mono&quot;&gt;(n − 1)! ÷ 2&lt;/span&gt;?&lt;/h1&gt;
  &lt;p style=&quot;margin:0 0 .4em&quot;&gt;Let&#x27;s count every route for &lt;b&gt;4 cities&lt;/b&gt;: 🏠 Home, A, B and C. Click through the steps.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;grid-template-columns:1fr 1.5fr&quot;&gt;
    &lt;div style=&quot;display:flex;flex-direction:column;gap:10px&quot;&gt;
      &lt;div class=&quot;step card&quot; data-s=&quot;1&quot;&gt;&lt;b&gt;① Fix the start: n − 1&lt;/b&gt;&lt;br&gt;
        A route is a &lt;b&gt;loop&lt;/b&gt;, so it doesn&#x27;t matter where you start. Always start at 🏠.
        That leaves &lt;b&gt;n − 1 = 3&lt;/b&gt; cities to put in order.&lt;/div&gt;
      &lt;div class=&quot;step card&quot; data-s=&quot;2&quot;&gt;&lt;b&gt;② Count the orders: (n − 1)!&lt;/b&gt;&lt;br&gt;
        1st stop: &lt;b&gt;3&lt;/b&gt; choices, 2nd: &lt;b&gt;2&lt;/b&gt;, last: &lt;b&gt;1&lt;/b&gt;.&lt;br&gt;
        &lt;span class=&quot;mono&quot;&gt;3 × 2 × 1 = 3! = &lt;b&gt;6&lt;/b&gt;&lt;/span&gt; orders.&lt;/div&gt;
      &lt;div class=&quot;step card&quot; data-s=&quot;3&quot;&gt;&lt;b&gt;③ Each loop is counted twice: ÷ 2&lt;/b&gt;&lt;br&gt;
        🏠→A→B→C→🏠 is the &lt;b&gt;same loop&lt;/b&gt; as 🏠→C→B→A→🏠, just driven backwards.
        So &lt;span class=&quot;mono&quot;&gt;6 ÷ 2 = &lt;b&gt;3&lt;/b&gt;&lt;/span&gt; different routes.&lt;/div&gt;
      &lt;div class=&quot;tools&quot; style=&quot;margin:0&quot;&gt;
        &lt;button class=&quot;btn&quot; id=&quot;cntBack&quot;&gt;◀ Back&lt;/button&gt;
        &lt;button class=&quot;btn solid&quot; id=&quot;cntNext&quot;&gt;Next step ▶&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot; style=&quot;display:flex;flex-direction:column&quot;&gt;
      &lt;div id=&quot;loops&quot; style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:8px&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;formula-big&quot; id=&quot;cntFormula&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3. Why it&#x27;s intractable ============ --&gt;
&lt;section class=&quot;slide&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Why can&#x27;t we just solve it?&lt;/span&gt;
  &lt;h1&gt;The travelling salesman problem&lt;/h1&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;p&gt;Visit every city &lt;b&gt;once&lt;/b&gt;, return home, and find the &lt;b&gt;shortest&lt;/b&gt; route. The brute-force approach checks &lt;b&gt;every possible route&lt;/b&gt;.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Number of cities: &lt;span class=&quot;mono&quot; id=&quot;cityN&quot;&gt;5&lt;/span&gt;&lt;/b&gt;&lt;/p&gt;
      &lt;input type=&quot;range&quot; id=&quot;citySlider&quot; min=&quot;4&quot; max=&quot;30&quot; value=&quot;5&quot;&gt;
      &lt;p style=&quot;margin-top:14px&quot;&gt;Possible routes &lt;span class=&quot;mono&quot;&gt;(n − 1)! ÷ 2&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;bigstat&quot; id=&quot;routes&quot;&gt;12&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;p&gt;Checking &lt;b&gt;1 billion routes per second&lt;/b&gt;, it would take:&lt;/p&gt;
      &lt;div class=&quot;bigstat&quot; id=&quot;timeTaken&quot;&gt;instantly&lt;/div&gt;
      &lt;div class=&quot;timebar&quot;&gt;&lt;div id=&quot;timeFill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;p id=&quot;timeNote&quot; style=&quot;margin-top:12px&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 3. Heuristics ============ --&gt;
&lt;section class=&quot;slide&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;The main answer&lt;/span&gt;
  &lt;h1&gt;Use a heuristic&lt;/h1&gt;
  &lt;div class=&quot;def&quot;&gt;A &lt;b&gt;heuristic&lt;/b&gt; is an algorithm that makes a &lt;span class=&quot;hl&quot;&gt;guess based on experience&lt;/span&gt; (a &quot;rule of thumb&quot;)
    to find a &lt;span class=&quot;hl&quot;&gt;close-to-optimal solution&lt;/span&gt; in a &lt;b&gt;reasonable time&lt;/b&gt;.&lt;/div&gt;
  &lt;p style=&quot;margin:.8em 0 0&quot;&gt;👆 Click each card to see what the mark scheme is looking for.&lt;/p&gt;
  &lt;div class=&quot;points&quot;&gt;
    &lt;div class=&quot;point p1&quot;&gt;&lt;b&gt;✅ A guess based on experience&lt;/b&gt;&lt;div class=&quot;hide&quot;&gt;It uses a rule of thumb rather than checking every possibility, e.g. &quot;always go to the nearest city next&quot;.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;point p2&quot;&gt;&lt;b&gt;🎯 Close to optimal / an approximation&lt;/b&gt;&lt;div class=&quot;hide&quot;&gt;The answer is usually &lt;b&gt;good&lt;/b&gt;, often within a few % of the best, but it&#x27;s not guaranteed to be &lt;b&gt;the&lt;/b&gt; best.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;point p3&quot;&gt;&lt;b&gt;⚠️ Only works in some cases&lt;/b&gt;&lt;div class=&quot;hide&quot;&gt;For some inputs, the rule of thumb can lead to a poor answer. It&#x27;s a trade-off: speed instead of certainty.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;point p4&quot;&gt;&lt;b&gt;🚫 A non-optimal solution&lt;/b&gt;&lt;div class=&quot;hide&quot;&gt;We &lt;b&gt;accept&lt;/b&gt; that the answer might not be perfect, because a perfect answer would take far too long.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 4. TSP lab ============ --&gt;
&lt;section class=&quot;slide&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Try it yourself&lt;/span&gt;
  &lt;h1 style=&quot;margin-bottom:.1em&quot;&gt;Heuristics in action&lt;/h1&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;grid-template-columns:1.35fr 1fr;flex:0 0 auto&quot;&gt;
    &lt;div&gt;
      &lt;canvas id=&quot;map&quot; width=&quot;640&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;tools&quot;&gt;
        &lt;button class=&quot;btn&quot; id=&quot;newCities&quot;&gt;🎲 New cities&lt;/button&gt;
        &lt;label style=&quot;align-self:center&quot;&gt;Cities &lt;select id=&quot;nCities&quot;&gt;&lt;option&gt;6&lt;/option&gt;&lt;option selected&gt;8&lt;/option&gt;&lt;option&gt;9&lt;/option&gt;&lt;option&gt;10&lt;/option&gt;&lt;option&gt;15&lt;/option&gt;&lt;option&gt;25&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;notes&quot;&gt;
        &lt;div class=&quot;note&quot; style=&quot;border-color:#9ca3af&quot;&gt;&lt;b&gt;🎲 Random route&lt;/b&gt;
          Visit the cities in any order. Instant, but no strategy, so the route is usually long. It&#x27;s our &lt;b&gt;baseline&lt;/b&gt;, not a heuristic.&lt;/div&gt;
        &lt;div class=&quot;note&quot; style=&quot;border-color:#2563eb&quot;&gt;&lt;b&gt;🏃 Greedy (nearest neighbour)&lt;/b&gt;
          From where you are, always go to the &lt;b&gt;closest unvisited city&lt;/b&gt;. A rule of thumb: fast and usually good, but it can leave a long trip home at the end.&lt;/div&gt;
        &lt;div class=&quot;note&quot; style=&quot;border-color:#d97706&quot;&gt;&lt;b&gt;⛰️ Hill-climbing&lt;/b&gt;
          Start with a route, then try &lt;b&gt;small changes&lt;/b&gt; (reverse a section). Keep a change only if it&#x27;s shorter. Stop when nothing helps: it may be stuck on a &quot;local best&quot;.&lt;/div&gt;
        &lt;div class=&quot;note&quot; style=&quot;border-color:#16a34a&quot;&gt;&lt;b&gt;🐢 Brute force&lt;/b&gt;
          Check &lt;b&gt;every one&lt;/b&gt; of the (n − 1)! ÷ 2 routes. &lt;b&gt;Guaranteed&lt;/b&gt; best, but only possible for a few cities. That&#x27;s why the problem is intractable.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;tools&quot;&gt;
        &lt;button class=&quot;btn&quot; id=&quot;randBtn&quot;&gt;🎲 Random route&lt;/button&gt;
        &lt;button class=&quot;btn&quot; id=&quot;greedyBtn&quot;&gt;🏃 Greedy&lt;/button&gt;
        &lt;button class=&quot;btn&quot; id=&quot;hillBtn&quot;&gt;⛰️ Hill-climb&lt;/button&gt;
        &lt;button class=&quot;btn solid&quot; id=&quot;optBtn&quot;&gt;🐢 Optimal (brute force)&lt;/button&gt;
      &lt;/div&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Method&lt;/th&gt;&lt;th&gt;Length&lt;/th&gt;&lt;th&gt;vs best&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;sw&quot; style=&quot;background:#9ca3af&quot;&gt;&lt;/span&gt;Random&lt;/td&gt;&lt;td id=&quot;lenRand&quot;&gt;–&lt;/td&gt;&lt;td id=&quot;pctRand&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;sw&quot; style=&quot;background:#2563eb&quot;&gt;&lt;/span&gt;Greedy&lt;/td&gt;&lt;td id=&quot;lenGreedy&quot;&gt;–&lt;/td&gt;&lt;td id=&quot;pctGreedy&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;sw&quot; style=&quot;background:#d97706&quot;&gt;&lt;/span&gt;Hill-climb&lt;/td&gt;&lt;td id=&quot;lenHill&quot;&gt;–&lt;/td&gt;&lt;td id=&quot;pctHill&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;sw&quot; style=&quot;background:#16a34a&quot;&gt;&lt;/span&gt;Optimal&lt;/td&gt;&lt;td id=&quot;lenOpt&quot;&gt;–&lt;/td&gt;&lt;td id=&quot;pctOpt&quot;&gt;–&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
      &lt;div class=&quot;msg&quot; id=&quot;labMsg&quot;&gt;Start with &lt;b&gt;Greedy&lt;/b&gt;: always travel to the &lt;b&gt;nearest unvisited city&lt;/b&gt;. It&#x27;s a rule of thumb!&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 5. Other approaches ============ --&gt;
&lt;section class=&quot;slide&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Other marking points&lt;/span&gt;
  &lt;h1&gt;Change the problem itself&lt;/h1&gt;
  &lt;p&gt;Instead of a heuristic, a programmer can make the problem &lt;b&gt;easier to solve&lt;/b&gt;. Click to flip.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot; style=&quot;flex:0;margin-top:10px&quot;&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;
      &lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🔓&lt;/div&gt;&lt;h2&gt;Relax some of the constraints&lt;/h2&gt;&lt;p&gt;Loosen the rules the solution must follow.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;h2&gt;Relax the constraints&lt;/h2&gt;
        &lt;p&gt;🗺️ &quot;The salesman doesn&#x27;t have to return home.&quot;&lt;/p&gt;
        &lt;p&gt;📍 &quot;Visit &lt;b&gt;most&lt;/b&gt; cities, not all of them.&quot;&lt;/p&gt;
        &lt;p&gt;⏱️ &quot;Any route within 5% of the best is fine.&quot;&lt;/p&gt;
        &lt;p class=&quot;mono&quot; style=&quot;color:var(--muted)&quot;&gt;Fewer rules → far fewer possibilities to check.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;
      &lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🧩&lt;/div&gt;&lt;h2&gt;Solve a simpler version&lt;/h2&gt;&lt;p&gt;Break it down or shrink it.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;h2&gt;Solve a simpler version&lt;/h2&gt;
        &lt;p&gt;🏙️ Split the map into regions and solve each small region separately.&lt;/p&gt;
        &lt;p&gt;🔢 Only consider each city&#x27;s 3 nearest neighbours.&lt;/p&gt;
        &lt;p&gt;📦 Solve it for today&#x27;s 10 deliveries, not the whole country.&lt;/p&gt;
        &lt;p class=&quot;mono&quot; style=&quot;color:var(--muted)&quot;&gt;Small inputs are still fast, even for intractable problems.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 6. Heuristic methods ============ --&gt;
&lt;section class=&quot;slide&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Name an example: 1 mark&lt;/span&gt;
  &lt;h1&gt;Heuristic methods&lt;/h1&gt;
  &lt;p&gt;The mark scheme accepts any reasonable example. Click a method to see how it works.&lt;/p&gt;
  &lt;div class=&quot;grid3&quot; style=&quot;margin-top:8px&quot;&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🏃&lt;/div&gt;&lt;h2&gt;Greedy algorithm&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;p&gt;&lt;b&gt;Always take the best-looking option right now.&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Nearest city next; biggest coin first when giving change.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;⛰️&lt;/div&gt;&lt;h2&gt;Hill-climbing / local improvement&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;p&gt;&lt;b&gt;Start with any answer, then keep making small improvements&lt;/b&gt; until none help.&lt;/p&gt;&lt;p&gt;Risk: you can get stuck on a &quot;small hill&quot; (a local best).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🔥&lt;/div&gt;&lt;h2&gt;Simulated annealing&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;p&gt;&lt;b&gt;Like hill-climbing, but sometimes accepts a worse move&lt;/b&gt; early on, to escape small hills.&lt;/p&gt;&lt;p&gt;Named after cooling metal slowly.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🎲&lt;/div&gt;&lt;h2&gt;Stochastic (random) methods&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;p&gt;&lt;b&gt;Try lots of random solutions&lt;/b&gt; and keep the best one found in the time available.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🔁&lt;/div&gt;&lt;h2&gt;Trial and error&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;p&gt;&lt;b&gt;Try a solution, check it, adjust, try again.&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Simple, but surprisingly common in practice.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;flip&quot;&gt;&lt;div class=&quot;inner&quot;&gt;&lt;div class=&quot;face front&quot;&gt;&lt;div class=&quot;ico&quot;&gt;🚚&lt;/div&gt;&lt;h2&gt;Real world&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;face back&quot;&gt;&lt;p&gt;Delivery van routes, airline schedules and school timetables all rely on heuristics.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;satnav&quot;&gt;
    &lt;h2&gt;🚗 Case study: how does a sat-nav choose your route?&lt;/h2&gt;
    &lt;div class=&quot;satgrid&quot;&gt;
      &lt;div class=&quot;sat&quot; style=&quot;border-color:#2563eb&quot;&gt;&lt;b&gt;📍 A → B&lt;/b&gt;
        A fast &lt;b&gt;shortest-path&lt;/b&gt; algorithm such as &lt;b&gt;Dijkstra&#x27;s&lt;/b&gt; or &lt;b&gt;A*&lt;/b&gt;. A* uses a heuristic (&quot;head roughly towards the destination&quot;) to search fewer roads.&lt;/div&gt;
      &lt;div class=&quot;sat&quot; style=&quot;border-color:#d97706&quot;&gt;&lt;b&gt;📦 Several stops&lt;/b&gt;
        Choosing the best &lt;b&gt;order&lt;/b&gt; of stops is the travelling salesman problem, which is &lt;b&gt;intractable&lt;/b&gt;. So it uses heuristics like &lt;b&gt;greedy&lt;/b&gt; or &lt;b&gt;local improvement&lt;/b&gt;.&lt;/div&gt;
      &lt;div class=&quot;sat&quot; style=&quot;border-color:#dc2626&quot;&gt;&lt;b&gt;⚠️ Not always optimal&lt;/b&gt;
        Traffic and road speeds are &lt;b&gt;estimates&lt;/b&gt;, conditions change after you set off, and with many stops it settles for a &lt;b&gt;good-enough&lt;/b&gt; order, not the perfect one.&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;satq&quot;&gt;🤔 &lt;b&gt;Think:&lt;/b&gt; if the sat-nav sends you the slow way, is it the &lt;b&gt;algorithm&lt;/b&gt; that&#x27;s wrong, or the &lt;b&gt;data&lt;/b&gt;?&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ 7. Write and self-mark ============ --&gt;
&lt;section class=&quot;slide&quot;&gt;
  &lt;span class=&quot;kicker&quot;&gt;Your turn&lt;/span&gt;
  &lt;h1 style=&quot;margin-bottom:.2em&quot;&gt;Write it, then mark it&lt;/h1&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div style=&quot;display:flex;flex-direction:column&quot;&gt;
      &lt;p style=&quot;margin:0 0 .4em&quot;&gt;&lt;b&gt;&quot;What approach might a programmer take if asked to &#x27;solve&#x27; an intractable problem?&quot;&lt;/b&gt;&lt;/p&gt;
      &lt;textarea placeholder=&quot;Write your answer here…&quot;&gt;&lt;/textarea&gt;
      &lt;div class=&quot;tools&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;modelBtn&quot;&gt;👀 Show model answer&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;model&quot; id=&quot;model&quot;&gt;A programmer could use a &lt;b&gt;heuristic&lt;/b&gt;, such as a &lt;b&gt;greedy algorithm&lt;/b&gt; or &lt;b&gt;hill-climbing&lt;/b&gt;.
        This uses a &lt;b&gt;rule of thumb based on experience&lt;/b&gt; to find a &lt;b&gt;close-to-optimal (approximate) solution&lt;/b&gt; in a reasonable time,
        although it &lt;b&gt;may not be optimal&lt;/b&gt; and &lt;b&gt;may only work well in some cases&lt;/b&gt;. Alternatively, they could &lt;b&gt;relax some of the
        constraints&lt;/b&gt; or &lt;b&gt;solve a simpler version&lt;/b&gt; of the problem.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h2&gt;✅ Tick each point your answer includes&lt;/h2&gt;
      &lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt; Uses a &lt;b&gt;heuristic&lt;/b&gt; / a guess based on experience&lt;/label&gt;
      &lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt; Gives a &lt;b&gt;close-to-optimal&lt;/b&gt; solution / an approximation&lt;/label&gt;
      &lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt; Recognises it is &lt;b&gt;non-optimal&lt;/b&gt; / only works in some cases&lt;/label&gt;
      &lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt; Names an &lt;b&gt;example method&lt;/b&gt; (greedy, hill-climbing, simulated annealing…)&lt;/label&gt;
      &lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt; &lt;b&gt;Relax&lt;/b&gt; some of the constraints&lt;/label&gt;
      &lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt; Solve a &lt;b&gt;simpler version&lt;/b&gt; of the problem&lt;/label&gt;
      &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0 marking points&lt;/div&gt;
      &lt;p style=&quot;color:var(--muted);margin:.3em 0 0&quot;&gt;Check the number of marks on your paper: you need at least that many &lt;b&gt;different&lt;/b&gt; points.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;/div&gt;

&lt;div class=&quot;nav&quot;&gt;
  &lt;button id=&quot;prev&quot;&gt;◀&lt;/button&gt;&lt;span id=&quot;count&quot;&gt;1 / 7&lt;/span&gt;&lt;button id=&quot;next&quot;&gt;▶&lt;/button&gt;
&lt;/div&gt;

&lt;script&gt;
  // ---------------- Slide navigation ----------------
  const slides = [...document.querySelectorAll(&quot;.slide&quot;)];
  let cur = 0;
  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, k) =&gt; s.classList.toggle(&quot;active&quot;, k === cur));
    document.getElementById(&quot;count&quot;).textContent = `${cur + 1} / ${slides.length}`;
    document.getElementById(&quot;prev&quot;).disabled = cur === 0;
    document.getElementById(&quot;next&quot;).disabled = cur === slides.length - 1;
  }
  document.getElementById(&quot;prev&quot;).onclick = () =&gt; show(cur - 1);
  document.getElementById(&quot;next&quot;).onclick = () =&gt; show(cur + 1);
  document.addEventListener(&quot;keydown&quot;, e =&gt; {
    if ([&quot;TEXTAREA&quot;, &quot;INPUT&quot;, &quot;SELECT&quot;].includes(e.target.tagName)) return;
    if (e.key === &quot;ArrowRight&quot; || e.key === &quot; &quot;) { e.preventDefault(); show(cur + 1); }
    if (e.key === &quot;ArrowLeft&quot;) show(cur - 1);
  });
  show(0);

  // Clickable cards
  document.querySelectorAll(&quot;.point, .flip&quot;).forEach(c =&gt; c.onclick = () =&gt; c.classList.toggle(&quot;open&quot;));

  // ---------------- Counting slide: (n-1)! / 2 ----------------
  const PTS = { H: [20, 20], A: [80, 20], B: [80, 80], C: [20, 80] };
  const ORDERS = [&quot;ABC&quot;, &quot;ACB&quot;, &quot;BAC&quot;, &quot;BCA&quot;, &quot;CAB&quot;, &quot;CBA&quot;];
  // Each order and its reverse are the same loop – give each pair the same colour
  const PAIR = { ABC: 0, CBA: 0, ACB: 1, BCA: 1, BAC: 2, CAB: 2 };
  const PAIR_COL = [&quot;#2563eb&quot;, &quot;#d97706&quot;, &quot;#16a34a&quot;];
  let cntStep = 1;

  function loopSVG(order, col) {
    const path = [&quot;H&quot;, ...order, &quot;H&quot;].map(p =&gt; PTS[p].join(&quot;,&quot;)).join(&quot; &quot;);
    const dots = Object.entries(PTS).map(([k, [x, y]]) =&gt;
      `&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;9&quot; fill=&quot;${k === &quot;H&quot; ? &quot;#4c1130&quot; : &quot;#1f2937&quot;}&quot;/&gt;
       &lt;text x=&quot;${x}&quot; y=&quot;${y + 4}&quot; font-size=&quot;10&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-family=&quot;Fredoka&quot;&gt;${k === &quot;H&quot; ? &quot;🏠&quot; : k}&lt;/text&gt;`).join(&quot;&quot;);
    return `&lt;svg viewBox=&quot;0 0 100 100&quot;&gt;&lt;polyline points=&quot;${path}&quot; fill=&quot;none&quot; stroke=&quot;${col}&quot; stroke-width=&quot;5&quot; stroke-linejoin=&quot;round&quot;/&gt;${dots}&lt;/svg&gt;`;
  }
  function renderCount() {
    document.querySelectorAll(&quot;.step&quot;).forEach(s =&gt; s.classList.toggle(&quot;on&quot;, Number(s.dataset.s) &lt;= cntStep));
    const grouped = cntStep &gt;= 3;
    const list = grouped ? [&quot;ABC&quot;, &quot;CBA&quot;, &quot;ACB&quot;, &quot;BCA&quot;, &quot;BAC&quot;, &quot;CAB&quot;] : ORDERS;
    document.getElementById(&quot;loops&quot;).innerHTML = list.map((o, i) =&gt; {
      const col = grouped ? PAIR_COL[PAIR[o]] : &quot;#7a1f4d&quot;;
      const label = `🏠→${o.split(&quot;&quot;).join(&quot;→&quot;)}→🏠`;
      return `&lt;div class=&quot;loop ${cntStep &gt;= 2 ? &quot;show&quot; : &quot;&quot;} ${grouped ? &quot;p&quot; + PAIR[o] : &quot;&quot;}&quot; style=&quot;${grouped ? `border-color:${col}` : &quot;&quot;}&quot;&gt;
        ${loopSVG(o, col)}&lt;small&gt;${label}&lt;/small&gt;&lt;/div&gt;`;
    }).join(&quot;&quot;);
    document.getElementById(&quot;cntFormula&quot;).innerHTML = {
      1: &quot;n = 4 cities → fix 🏠 → &lt;b&gt;3&lt;/b&gt; left to arrange&quot;,
      2: &quot;3 × 2 × 1 = 3! = &lt;b&gt;6&lt;/b&gt; orders&quot;,
      3: &quot;Matching colours = same loop!&lt;br&gt;(4 − 1)! ÷ 2 = 6 ÷ 2 = &lt;b&gt;3 routes&lt;/b&gt;&quot;
    }[cntStep];
    document.getElementById(&quot;cntBack&quot;).disabled = cntStep === 1;
    document.getElementById(&quot;cntNext&quot;).disabled = cntStep === 3;
  }
  document.getElementById(&quot;cntNext&quot;).onclick = () =&gt; { cntStep = Math.min(3, cntStep + 1); renderCount(); };
  document.getElementById(&quot;cntBack&quot;).onclick = () =&gt; { cntStep = Math.max(1, cntStep - 1); renderCount(); };
  document.querySelectorAll(&quot;.step&quot;).forEach(s =&gt; s.onclick = () =&gt; { cntStep = Number(s.dataset.s); renderCount(); });
  renderCount();

  // ---------------- Slide 3: route explosion ----------------
  function factorial(n) { let r = 1n; for (let i = 2n; i &lt;= BigInt(n); i++) r *= i; return r; }
  function bigFmt(b) {
    const s = b.toString();
    if (s.length &lt;= 9) return Number(b).toLocaleString();
    return `${s[0]}.${s.slice(1, 3)} × 10${String(s.length - 1).split(&quot;&quot;).map(d =&gt; &quot;⁰¹²³⁴⁵⁶⁷⁸⁹&quot;[d]).join(&quot;&quot;)}`;
  }
  function timeFmt(sec) {
    const yr = 365.25 * 24 * 3600;
    if (sec &lt; 1) return [&quot;instantly&quot;, 2, &quot;var(--good)&quot;];
    if (sec &lt; 60) return [`${sec.toFixed(0)} seconds`, 10, &quot;var(--good)&quot;];
    if (sec &lt; 3600) return [`${(sec / 60).toFixed(0)} minutes`, 25, &quot;var(--warn)&quot;];
    if (sec &lt; 86400) return [`${(sec / 3600).toFixed(1)} hours`, 40, &quot;var(--warn)&quot;];
    if (sec &lt; yr) return [`${(sec / 86400).toFixed(0)} days`, 55, &quot;var(--warn)&quot;];
    const y = sec / yr;
    if (y &lt; 1e6) return [`${Math.round(y).toLocaleString()} years`, 75, &quot;var(--bad)&quot;];
    if (y &lt; 1e9) return [`${(y / 1e6).toFixed(0)} million years`, 90, &quot;var(--bad)&quot;];
    return [`${(y / 1e9).toLocaleString(undefined, { maximumFractionDigits: 0 })} billion years`, 100, &quot;var(--bad)&quot;];
  }
  function updateRoutes() {
    const n = Number(document.getElementById(&quot;citySlider&quot;).value);
    const routes = factorial(n - 1) / 2n;
    document.getElementById(&quot;cityN&quot;).textContent = n;
    document.getElementById(&quot;routes&quot;).textContent = bigFmt(routes);
    const sec = Number(routes) / 1e9;
    const [txt, pct, col] = timeFmt(sec);
    document.getElementById(&quot;timeTaken&quot;).textContent = txt;
    const fill = document.getElementById(&quot;timeFill&quot;);
    fill.style.width = pct + &quot;%&quot;; fill.style.background = col;
    document.getElementById(&quot;timeNote&quot;).innerHTML = n &lt;= 12
      ? &quot;Still manageable: small inputs are fine, even for intractable problems.&quot;
      : n &lt;= 20 ? &quot;Each extra city multiplies the work. This is &lt;b&gt;factorial growth&lt;/b&gt;, worse than exponential!&quot;
      : &quot;The universe is about 14 billion years old. Brute force is &lt;b&gt;not an option&lt;/b&gt;: we need a different approach.&quot;;
  }
  document.getElementById(&quot;citySlider&quot;).oninput = updateRoutes;
  updateRoutes();

  // ---------------- Slide 4: TSP lab ----------------
  const canvas = document.getElementById(&quot;map&quot;), ctx = canvas.getContext(&quot;2d&quot;);
  let cities = [], routes = {}, hillTimer = null;
  const NORMAL = { rand: &quot;#9ca3af&quot;, greedy: &quot;#2563eb&quot;, hill: &quot;#d97706&quot;, opt: &quot;#16a34a&quot; };
  const HIGH = { rand: &quot;#ffffff&quot;, greedy: &quot;#4da3ff&quot;, hill: &quot;#ffb000&quot;, opt: &quot;#00e676&quot; };
  const isHC = () =&gt; document.body.classList.contains(&quot;hc&quot;);
  const dist = (a, b) =&gt; Math.hypot(cities[a].x - cities[b].x, cities[a].y - cities[b].y);
  const tourLen = t =&gt; t.reduce((s, c, i) =&gt; s + dist(c, t[(i + 1) % t.length]), 0);

  function newCities() {
    clearInterval(hillTimer);
    const n = Number(document.getElementById(&quot;nCities&quot;).value);
    cities = [];
    while (cities.length &lt; n) {
      const p = { x: 40 + Math.random() * 560, y: 40 + Math.random() * 320 };
      if (cities.every(c =&gt; Math.hypot(c.x - p.x, c.y - p.y) &gt; 45)) cities.push(p);
    }
    routes = {};
    document.getElementById(&quot;optBtn&quot;).disabled = n &gt; 10;
    document.getElementById(&quot;optBtn&quot;).title = n &gt; 10 ? &quot;Too many cities to brute force in a browser!&quot; : &quot;&quot;;
    [&quot;Rand&quot;, &quot;Greedy&quot;, &quot;Hill&quot;, &quot;Opt&quot;].forEach(k =&gt; {
      document.getElementById(&quot;len&quot; + k).textContent = &quot;–&quot;;
      document.getElementById(&quot;pct&quot; + k).textContent = &quot;–&quot;;
    });
    setMsg(n &gt; 10
      ? `With &lt;b&gt;${n} cities&lt;/b&gt; there are too many routes to brute force here. Heuristics are the &lt;b&gt;only&lt;/b&gt; practical option!`
      : &quot;Start with &lt;b&gt;Greedy&lt;/b&gt;: always travel to the &lt;b&gt;nearest unvisited city&lt;/b&gt;. It&#x27;s a rule of thumb!&quot;);
    draw();
  }

  function draw(active) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const show = active ? [active] : Object.keys(routes);
    show.forEach(k =&gt; {
      const t = routes[k]; if (!t) return;
      ctx.strokeStyle = (isHC() ? HIGH : NORMAL)[k]; ctx.lineWidth = (k === &quot;opt&quot; ? 5 : 3) + (isHC() ? 2 : 0);
      ctx.setLineDash(k === &quot;rand&quot; ? [8, 6] : []);
      ctx.globalAlpha = active || show.length === 1 ? 1 : 0.75;
      ctx.beginPath();
      t.forEach((c, i) =&gt; i ? ctx.lineTo(cities[c].x, cities[c].y) : ctx.moveTo(cities[c].x, cities[c].y));
      ctx.closePath(); ctx.stroke();
    });
    ctx.globalAlpha = 1; ctx.setLineDash([]);
    cities.forEach((c, i) =&gt; {
      ctx.beginPath(); ctx.arc(c.x, c.y, i === 0 ? 11 : 8, 0, Math.PI * 2);
      ctx.fillStyle = isHC() ? (i === 0 ? &quot;#ffd400&quot; : &quot;#ffffff&quot;) : (i === 0 ? &quot;#4c1130&quot; : &quot;#1f2937&quot;); ctx.fill();
      if (i === 0) { ctx.fillStyle = &quot;#fff&quot;; ctx.font = &quot;bold 11px Fredoka&quot;; ctx.textAlign = &quot;center&quot;; ctx.fillText(&quot;🏠&quot;, c.x, c.y + 4); }
    });
  }

  function setResult(key, tour) {
    routes[key] = tour;
    const cap = key[0].toUpperCase() + key.slice(1);
    document.getElementById(&quot;len&quot; + cap).textContent = Math.round(tourLen(tour));
    refreshPct();
  }
  function refreshPct() {
    const best = routes.opt ? tourLen(routes.opt) : null;
    [&quot;rand&quot;, &quot;greedy&quot;, &quot;hill&quot;, &quot;opt&quot;].forEach(k =&gt; {
      const cap = k[0].toUpperCase() + k.slice(1);
      if (!routes[k]) return;
      document.getElementById(&quot;pct&quot; + cap).textContent = best
        ? (k === &quot;opt&quot; ? &quot;best ✅&quot; : `+${((tourLen(routes[k]) / best - 1) * 100).toFixed(1)}%`) : &quot;?&quot;;
    });
  }
  const setMsg = html =&gt; document.getElementById(&quot;labMsg&quot;).innerHTML = html;

  // Random route
  document.getElementById(&quot;randBtn&quot;).onclick = () =&gt; {
    clearInterval(hillTimer);
    const rest = cities.map((_, i) =&gt; i).slice(1).sort(() =&gt; Math.random() - 0.5);
    setResult(&quot;rand&quot;, [0, ...rest]); draw(&quot;rand&quot;);
    setMsg(&quot;A &lt;b&gt;random&lt;/b&gt; route: fast to produce, but usually long. No thinking involved!&quot;);
  };

  // Greedy: nearest neighbour
  function greedy() {
    const t = [0], left = new Set(cities.map((_, i) =&gt; i).slice(1));
    while (left.size) {
      const last = t[t.length - 1];
      let best = null;
      left.forEach(c =&gt; { if (best === null || dist(last, c) &lt; dist(last, best)) best = c; });
      t.push(best); left.delete(best);
    }
    return t;
  }
  document.getElementById(&quot;greedyBtn&quot;).onclick = () =&gt; {
    clearInterval(hillTimer);
    setResult(&quot;greedy&quot;, greedy()); draw(&quot;greedy&quot;);
    setMsg(&quot;&lt;b&gt;Greedy:&lt;/b&gt; always go to the nearest unvisited city. Very fast and usually decent, but notice the long \&quot;return home\&quot; leg? It&#x27;s &lt;b&gt;not guaranteed&lt;/b&gt; to be the best.&quot;);
  };

  // Hill-climbing: keep reversing segments (2-opt) while it helps
  document.getElementById(&quot;hillBtn&quot;).onclick = () =&gt; {
    clearInterval(hillTimer);
    let t = (routes.greedy || greedy()).slice();
    let improvements = 0;
    setMsg(&quot;&lt;b&gt;Hill-climbing:&lt;/b&gt; start from the greedy route and keep making small improvements…&quot;);
    hillTimer = setInterval(() =&gt; {
      const n = t.length;
      let improved = false;
      outer:
      for (let i = 1; i &lt; n - 1; i++) {
        for (let k = i + 1; k &lt; n; k++) {
          const cand = t.slice(0, i).concat(t.slice(i, k + 1).reverse(), t.slice(k + 1));
          if (tourLen(cand) &lt; tourLen(t) - 0.01) { t = cand; improved = true; improvements++; break outer; }
        }
      }
      setResult(&quot;hill&quot;, t); draw(&quot;hill&quot;);
      if (!improved) {
        clearInterval(hillTimer);
        setMsg(`&lt;b&gt;Hill-climbing&lt;/b&gt; made &lt;b&gt;${improvements}&lt;/b&gt; improvement${improvements === 1 ? &quot;&quot; : &quot;s&quot;} and then got stuck: no small change helps any more.
                That&#x27;s a &lt;b&gt;local improvement&lt;/b&gt; heuristic. Usually very close to the best, but still not guaranteed.`);
      }
    }, 350);
  };

  // Optimal: brute force every route (only for small n)
  function permute(arr, cb) {
    const c = new Array(arr.length).fill(0);
    cb(arr);
    let i = 0;
    while (i &lt; arr.length) {
      if (c[i] &lt; i) {
        const j = i % 2 ? c[i] : 0;
        [arr[j], arr[i]] = [arr[i], arr[j]];
        cb(arr); c[i]++; i = 0;
      } else { c[i] = 0; i++; }
    }
  }
  document.getElementById(&quot;optBtn&quot;).onclick = () =&gt; {
    clearInterval(hillTimer);
    const rest = cities.map((_, i) =&gt; i).slice(1);
    let best = null, bestLen = Infinity, count = 0;
    const t0 = performance.now();
    permute(rest, p =&gt; {
      count++;
      const t = [0, ...p], l = tourLen(t);
      if (l &lt; bestLen) { bestLen = l; best = t; }
    });
    const ms = performance.now() - t0;
    setResult(&quot;opt&quot;, best); draw();
    setMsg(`&lt;b&gt;Brute force&lt;/b&gt; checked &lt;b&gt;${count.toLocaleString()}&lt;/b&gt; routes in ${ms.toFixed(0)} ms to guarantee the best.
            Compare the % column: how close did the heuristics get? Now try &lt;b&gt;15 cities&lt;/b&gt;.`);
  };

  document.getElementById(&quot;newCities&quot;).onclick = newCities;
  document.getElementById(&quot;nCities&quot;).onchange = newCities;
  newCities();


  // High contrast: switched on by the hub (postMessage works even in sandboxed previews)
  window.addEventListener(&quot;message&quot;, e =&gt; {
    if (e.data &amp;&amp; typeof e.data.hc === &quot;boolean&quot;) {
      document.body.classList.toggle(&quot;hc&quot;, e.data.hc);
      draw();
    }
  });

  // ---------------- Slide 7: self-mark ----------------
  const boxes = [...document.querySelectorAll(&quot;.check input&quot;)];
  boxes.forEach(b =&gt; b.onchange = () =&gt; {
    const n = boxes.filter(x =&gt; x.checked).length;
    document.getElementById(&quot;score&quot;).textContent = `${n} marking point${n === 1 ? &quot;&quot; : &quot;s&quot;}`;
  });
  document.getElementById(&quot;modelBtn&quot;).onclick = () =&gt; {
    const m = document.getElementById(&quot;model&quot;);
    m.classList.toggle(&quot;show&quot;);
    document.getElementById(&quot;modelBtn&quot;).textContent = m.classList.contains(&quot;show&quot;) ? &quot;🙈 Hide model answer&quot; : &quot;👀 Show model answer&quot;;
  };
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
  </div>
</div>
<script>
  // Each section is its own page: switching just shows one and hides the others
  function show(view) {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === view));
    document.querySelectorAll("iframe").forEach(f => f.classList.toggle("active", f.id === view));
    const f = document.getElementById(view);
    try { f.focus(); f.contentWindow.focus(); } catch (e) {}   // so the arrow keys work straight away
  }
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => show(t.dataset.view));

  // High contrast: tell every section to switch (postMessage works even in protected previews)
  let hc = false;
  try { hc = localStorage.getItem("hubHighContrast") === "1"; } catch (e) {}
  const hcBtn = document.getElementById("hcBtn");
  function applyHC() {
    hcBtn.setAttribute("aria-pressed", hc);
    hcBtn.textContent = hc ? "High contrast: ON" : "High contrast";
    document.querySelectorAll("iframe").forEach(f => { try { f.contentWindow.postMessage({ hc }, "*"); } catch (e) {} });
  }
  hcBtn.onclick = () => {
    hc = !hc;
    try { localStorage.setItem("hubHighContrast", hc ? "1" : "0"); } catch (e) {}
    applyHC();
  };
  document.querySelectorAll("iframe").forEach(f => f.addEventListener("load", applyHC));
  applyHC();
</script>
</body>
</html>
