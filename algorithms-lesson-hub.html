&lt;body&gt;

&lt;nav class=&quot;tabs&quot;&gt;
  &lt;button class=&quot;tab active&quot; data-tab=&quot;mergeTab&quot;&gt;🔀 Merge sort · O(n log n)&lt;/button&gt;
  &lt;button class=&quot;tab&quot; data-tab=&quot;bubbleTab&quot;&gt;🫧 Bubble sort · O(n²)&lt;/button&gt;

&lt;section id=&quot;mergeTab&quot; class=&quot;tabpage active&quot;&gt;
&lt;header&gt;
  &lt;h1&gt;🔀 Merge Sort: where does &lt;span class=&quot;mono&quot;&gt;n log n&lt;/span&gt; come from?&lt;/h1&gt;
  &lt;p&gt;Sorting 8 items, step by step.&lt;/p&gt;
&lt;/header&gt;

&lt;main&gt;
  &lt;!-- ================= Visual ================= --&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div id=&quot;visual&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;
      &lt;button id=&quot;backBtn&quot;&gt;◀ Back&lt;/button&gt;
      &lt;button id=&quot;nextBtn&quot; class=&quot;primary&quot;&gt;Next ▶&lt;/button&gt;
      &lt;button id=&quot;playBtn&quot;&gt;⏵ Play all&lt;/button&gt;
      &lt;button id=&quot;resetBtn&quot;&gt;↺ Reset&lt;/button&gt;
      &lt;button id=&quot;shuffleBtn&quot;&gt;🎲 New numbers&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;progress&quot; id=&quot;progress&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ================= Explanation ================= --&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div id=&quot;tag&quot;&gt;&lt;/div&gt;
    &lt;h2 class=&quot;step-title&quot; id=&quot;stepTitle&quot;&gt;&lt;/h2&gt;
    &lt;div class=&quot;explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;meters&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;levelsMeter&quot;&gt;0&lt;/div&gt;&lt;small&gt;split levels&lt;br&gt;(this is &lt;b&gt;log n&lt;/b&gt;)&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;workMeter&quot;&gt;0&lt;/div&gt;&lt;small&gt;work done&lt;br&gt;(items handled)&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot; id=&quot;formula&quot;&gt;n × log n = 8 × ? = ?&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ================= Compare ================= --&gt;
  &lt;div class=&quot;panel compare&quot;&gt;
    &lt;h2 class=&quot;step-title&quot;&gt;📈 Why it matters: merge sort vs bubble sort&lt;/h2&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin-top:0&quot;&gt;Drag the slider to make the list bigger and compare the amount of work.&lt;/p&gt;
    &lt;label for=&quot;nSlider&quot;&gt;&lt;b&gt;Number of items: &lt;span class=&quot;mono&quot; id=&quot;nLabel&quot;&gt;8&lt;/span&gt;&lt;/b&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;nSlider&quot; min=&quot;3&quot; max=&quot;20&quot; value=&quot;3&quot;&gt;
    &lt;div class=&quot;bars&quot;&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;Merge sort&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;O(n log n)&lt;/span&gt;&lt;/span&gt;
        &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill good&quot; id=&quot;goodBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot; id=&quot;goodNum&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;Bubble sort&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;O(n²)&lt;/span&gt;&lt;/span&gt;
        &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; id=&quot;badBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot; id=&quot;badNum&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;verdict&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Bars use a logarithmic scale for large lists, otherwise the merge sort bar would be too small to see!&lt;/p&gt;
  &lt;/div&gt;
&lt;/main&gt;
&lt;/section&gt;

&lt;!-- ======================= BUBBLE SORT TAB ======================= --&gt;
&lt;section id=&quot;bubbleTab&quot; class=&quot;tabpage&quot;&gt;
&lt;header&gt;
  &lt;h1&gt;🫧 Bubble Sort: why is it &lt;span class=&quot;mono&quot;&gt;O(n²)&lt;/span&gt;?&lt;/h1&gt;
  &lt;p&gt;Compare neighbours, swap if they&#x27;re in the wrong order, repeat.&lt;/p&gt;
&lt;/header&gt;
&lt;main&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;bars-area&quot; id=&quot;bArea&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;
      &lt;span&gt;&lt;i style=&quot;background:#f59e0b&quot;&gt;&lt;/i&gt;comparing&lt;/span&gt;
      &lt;span&gt;&lt;i style=&quot;background:#dc2626&quot;&gt;&lt;/i&gt;swapping&lt;/span&gt;
      &lt;span&gt;&lt;i style=&quot;background:#16a34a&quot;&gt;&lt;/i&gt;in final place&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;
      &lt;button id=&quot;bBack&quot;&gt;◀ Back&lt;/button&gt;
      &lt;button id=&quot;bNext&quot; class=&quot;primary&quot;&gt;Next ▶&lt;/button&gt;
      &lt;button id=&quot;bPlay&quot;&gt;⏵ Play&lt;/button&gt;
      &lt;button id=&quot;bReset&quot;&gt;↺ Reset&lt;/button&gt;
      &lt;button id=&quot;bRandom&quot;&gt;🎲 Random&lt;/button&gt;
      &lt;button id=&quot;bWorst&quot;&gt;⬇ Worst case&lt;/button&gt;
    &lt;/div&gt;
    &lt;label class=&quot;note&quot; style=&quot;display:block;text-align:center;margin-top:10px&quot;&gt;Speed
      &lt;input type=&quot;range&quot; id=&quot;bSpeed&quot; min=&quot;100&quot; max=&quot;1500&quot; value=&quot;700&quot; style=&quot;width:160px;vertical-align:middle;direction:rtl&quot;&gt;
    &lt;/label&gt;

    &lt;div class=&quot;codebox&quot; id=&quot;bCode&quot;&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;1&quot;&gt;&lt;span class=&quot;k&quot;&gt;for&lt;/span&gt; i &lt;span class=&quot;k&quot;&gt;in&lt;/span&gt; range(n - 1):            &lt;span class=&quot;c&quot;&gt;# outer loop: one pass each time&lt;/span&gt;&lt;/span&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;2&quot;&gt;    &lt;span class=&quot;k&quot;&gt;for&lt;/span&gt; j &lt;span class=&quot;k&quot;&gt;in&lt;/span&gt; range(n - 1 - i):    &lt;span class=&quot;c&quot;&gt;# inner loop: compare neighbours&lt;/span&gt;&lt;/span&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;3&quot;&gt;        &lt;span class=&quot;k&quot;&gt;if&lt;/span&gt; items[j] &gt; items[j + 1]:&lt;/span&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;4&quot;&gt;            items[j], items[j + 1] = items[j + 1], items[j]   &lt;span class=&quot;c&quot;&gt;# swap&lt;/span&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;
    &lt;div id=&quot;bTag&quot;&gt;&lt;/div&gt;
    &lt;h2 class=&quot;step-title&quot; id=&quot;bTitle&quot;&gt;&lt;/h2&gt;
    &lt;div class=&quot;explain&quot; id=&quot;bExplain&quot; style=&quot;min-height:110px&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;meters&quot; style=&quot;grid-template-columns:1fr 1fr 1fr&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;bPass&quot;&gt;0&lt;/div&gt;&lt;small&gt;pass&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;bComp&quot;&gt;0&lt;/div&gt;&lt;small&gt;comparisons&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;bSwaps&quot;&gt;0&lt;/div&gt;&lt;small&gt;swaps&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot; id=&quot;bFormula&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;panel compare&quot;&gt;
    &lt;h2 class=&quot;step-title&quot;&gt;🟧 The comparison grid: why it&#x27;s &quot;about n²&quot;&lt;/h2&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin-top:0&quot;&gt;Each square is one comparison. Row 1 is pass 1, row 2 is pass 2, and so on. Watch the squares fill as the sort runs.&lt;/p&gt;
    &lt;div class=&quot;gridwrap&quot;&gt;
      &lt;div class=&quot;cgrid&quot; id=&quot;cGrid&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;gridtext&quot;&gt;
        &lt;p&gt;Pass 1 makes &lt;b&gt;7&lt;/b&gt; comparisons, pass 2 makes &lt;b&gt;6&lt;/b&gt;, then 5, 4, 3, 2, 1.&lt;/p&gt;
        &lt;p class=&quot;mono&quot; style=&quot;font-size:1.1rem&quot;&gt;7+6+5+4+3+2+1 = &lt;b&gt;28&lt;/b&gt;&lt;/p&gt;
        &lt;p&gt;The filled squares make a &lt;b&gt;triangle&lt;/b&gt;: about &lt;b&gt;half&lt;/b&gt; of an n × n square.&lt;/p&gt;
        &lt;p class=&quot;mono&quot; style=&quot;font-size:1.1rem&quot;&gt;n(n − 1) ÷ 2 = (n² − n) ÷ 2&lt;/p&gt;
        &lt;p&gt;Big O rules:&lt;br&gt;1️⃣ keep the fastest-growing term → &lt;span class=&quot;mono&quot;&gt;n²&lt;/span&gt;&lt;br&gt;2️⃣ drop the constant ÷ 2 →
          &lt;b class=&quot;mono&quot; style=&quot;font-size:1.3rem&quot;&gt;O(n²)&lt;/b&gt;&lt;/p&gt;
        &lt;p class=&quot;note&quot;&gt;💡 The &lt;b&gt;nested loops&lt;/b&gt; are the clue: a loop inside a loop, and both depend on n.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;bars&quot; style=&quot;margin-top:18px&quot;&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;8 items&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; style=&quot;width:0.28%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot;&gt;28&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;100 items&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; style=&quot;width:4.95%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot;&gt;4,950&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;1,000 items&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot;&gt;499,500&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;10× more items → about &lt;b&gt;100× more comparisons&lt;/b&gt;. That&#x27;s what n² growth feels like.&lt;/p&gt;
  &lt;/div&gt;
&lt;/main&gt;
&lt;/section&gt;

&lt;script&gt;
  const N = 8;
  let values = [38, 27, 43, 3, 9, 82, 10, 5];
  let splitRows = [], mergeRows = [];
  let step = 0, playing = null;

  // ---------- Build the split and merge levels ----------
  function build() {
    splitRows = [[values.slice()]];
    while (splitRows[splitRows.length - 1].some(g =&gt; g.length &gt; 1)) {
      const prev = splitRows[splitRows.length - 1];
      splitRows.push(prev.flatMap(g =&gt; {
        if (g.length === 1) return [g];
        const mid = Math.ceil(g.length / 2);
        return [g.slice(0, mid), g.slice(mid)];
      }));
    }
    mergeRows = [];
    let current = splitRows[splitRows.length - 1];
    while (current.length &gt; 1) {
      const next = [];
      for (let i = 0; i &lt; current.length; i += 2) {
        next.push(i + 1 &lt; current.length ? merge(current[i], current[i + 1]) : current[i]);
      }
      mergeRows.push(next);
      current = next;
    }
  }
  function merge(a, b) {
    const out = []; let i = 0, j = 0;
    while (i &lt; a.length &amp;&amp; j &lt; b.length) out.push(a[i] &lt;= b[j] ? a[i++] : b[j++]);
    return out.concat(a.slice(i), b.slice(j));
  }

  // Colour each number by its size: small = cool, big = warm
  function colour(v) {
    const min = Math.min(...values), max = Math.max(...values);
    const t = max === min ? 0.5 : (v - min) / (max - min);
    return `hsl(${220 - t * 200}, 70%, 50%)`;
  }

  // ---------- Steps (one per frame) ----------
  const LOG = Math.log2(N); // 3
  function steps() {
    return [
      { kind: &quot;split&quot;, show: 0, title: &quot;The unsorted list&quot;,
        text: `We have &lt;b&gt;n = 8&lt;/b&gt; numbers to sort. Merge sort works in two parts:&lt;br&gt;
               &lt;b style=&quot;color:var(--split)&quot;&gt;1. Split&lt;/b&gt; the list in half again and again.&lt;br&gt;
               &lt;b style=&quot;color:var(--merge)&quot;&gt;2. Merge&lt;/b&gt; the pieces back together in order.` },
      { kind: &quot;split&quot;, show: 1, title: &quot;Split level 1&quot;,
        text: `Cut the list in half: &lt;b&gt;8 → 4 + 4&lt;/b&gt;.&lt;br&gt;Each half is now a smaller sorting problem.` },
      { kind: &quot;split&quot;, show: 2, title: &quot;Split level 2&quot;,
        text: `Cut each half in half again: &lt;b&gt;4 → 2 + 2&lt;/b&gt;.` },
      { kind: &quot;split&quot;, show: 3, title: &quot;Split level 3: single items&quot;,
        text: `Now every piece holds &lt;b&gt;1 item&lt;/b&gt; – and a list of 1 item is already sorted!&lt;br&gt;&lt;br&gt;
               We halved &lt;b&gt;3 times&lt;/b&gt;: 8 → 4 → 2 → 1.&lt;br&gt;That&#x27;s &lt;b&gt;log₂ 8 = 3&lt;/b&gt;, because 2³ = 8.
               &lt;br&gt;👉 &lt;b&gt;This is where log n comes from.&lt;/b&gt;` },
      { kind: &quot;merge&quot;, show: 4, title: &quot;Merge level 1: pairs&quot;,
        text: `Merge the single items into &lt;b&gt;sorted pairs&lt;/b&gt;, always taking the smaller front item first.&lt;br&gt;&lt;br&gt;
               All &lt;b&gt;8 items&lt;/b&gt; are handled at this level.` },
      { kind: &quot;merge&quot;, show: 5, title: &quot;Merge level 2: fours&quot;,
        text: `Merge the pairs into &lt;b&gt;sorted groups of 4&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               Again, all &lt;b&gt;8 items&lt;/b&gt; are handled.` },
      { kind: &quot;merge&quot;, show: 6, title: &quot;Merge level 3: sorted! ✅&quot;,
        text: `Merge the two groups of 4 into &lt;b&gt;one sorted list&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               All &lt;b&gt;8 items&lt;/b&gt; handled again.&lt;br&gt;👉 &lt;b&gt;Every level touches all n items. This is where the n comes from.&lt;/b&gt;` },
      { kind: &quot;sum&quot;, show: 6, title: &quot;Putting it together&quot;,
        text: `&lt;b&gt;3 levels&lt;/b&gt; (log n) × &lt;b&gt;8 items per level&lt;/b&gt; (n) = &lt;b&gt;24 steps&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               Bubble sort compares items over and over: about &lt;b&gt;8 × 8 = 64 steps&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               Small difference with 8 items… now try the slider below with a &lt;b&gt;million&lt;/b&gt;!` }
    ];
  }

  // ---------- Render ----------
  function rowHTML(groups, kind, label, sub, visible, current) {
    const gs = groups.map(g =&gt; `&lt;div class=&quot;group&quot;&gt;${
      g.map(v =&gt; `&lt;div class=&quot;cell&quot; style=&quot;background:${colour(v)}&quot;&gt;${v}&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;`).join(&quot;&quot;);
    return `&lt;div class=&quot;row ${kind} ${visible ? &quot;&quot; : &quot;hidden&quot;} ${current ? &quot;current&quot; : &quot;&quot;}&quot;&gt;
      &lt;div class=&quot;label&quot;&gt;&lt;b&gt;${label}&lt;/b&gt;${sub}&lt;/div&gt;&lt;div class=&quot;groups&quot;&gt;${gs}&lt;/div&gt;&lt;/div&gt;`;
  }

  function render() {
    const s = steps()[step];
    const v = document.getElementById(&quot;visual&quot;);
    let html = &quot;&quot;;
    splitRows.forEach((r, i) =&gt; {
      html += rowHTML(r, &quot;split&quot;, i === 0 ? &quot;Start&quot; : `Split ${i}`,
        i === 0 ? &quot;1 list&quot; : `${r.length} pieces`, s.show &gt;= i, s.show === i &amp;&amp; s.kind === &quot;split&quot;);
    });
    html += `&lt;div class=&quot;divider ${s.show &gt;= 4 ? &quot;&quot; : &quot;hidden&quot;}&quot;&gt;now merge back up ⬇&lt;/div&gt;`;
    mergeRows.forEach((r, i) =&gt; {
      const idx = splitRows.length + i;
      html += rowHTML(r, &quot;merge&quot;, `Merge ${i + 1}`, `8 items handled`,
        s.show &gt;= idx, s.show === idx &amp;&amp; s.kind === &quot;merge&quot;);
    });
    v.innerHTML = html;

    // Explanation panel
    const tagText = { split: &quot;✂️ Splitting&quot;, merge: &quot;🔗 Merging&quot;, sum: &quot;🧮 Summary&quot; }[s.kind];
    document.getElementById(&quot;tag&quot;).innerHTML = `&lt;span class=&quot;tag ${s.kind}&quot;&gt;${tagText}&lt;/span&gt;`;
    document.getElementById(&quot;stepTitle&quot;).textContent = s.title;
    document.getElementById(&quot;explain&quot;).innerHTML = s.text;

    const levels = Math.min(s.show, LOG);
    const mergesDone = Math.max(0, s.show - LOG);
    const work = mergesDone * N;
    document.getElementById(&quot;levelsMeter&quot;).textContent = levels;
    document.getElementById(&quot;workMeter&quot;).textContent = work;

    const parts = Array.from({ length: mergesDone }, () =&gt; N).join(&quot; + &quot;) || &quot;0&quot;;
    document.getElementById(&quot;formula&quot;).innerHTML = mergesDone === LOG
      ? `n × log n = 8 × 3 = &lt;span class=&quot;hl&quot;&gt;24&lt;/span&gt;&lt;br&gt;&lt;small&gt;(${parts})&lt;/small&gt;`
      : `work so far: ${parts}${mergesDone ? &quot; = &quot; + work : &quot;&quot;}`;

    document.getElementById(&quot;progress&quot;).innerHTML =
      steps().map((_, i) =&gt; `&lt;div class=&quot;dot ${i &lt;= step ? &quot;on&quot; : &quot;&quot;}&quot;&gt;&lt;/div&gt;`).join(&quot;&quot;);
    document.getElementById(&quot;backBtn&quot;).disabled = step === 0;
    document.getElementById(&quot;nextBtn&quot;).disabled = step === steps().length - 1;
  }

  // ---------- Controls ----------
  function stopPlay() { clearInterval(playing); playing = null; document.getElementById(&quot;playBtn&quot;).textContent = &quot;⏵ Play all&quot;; }
  document.getElementById(&quot;nextBtn&quot;).onclick = () =&gt; { stopPlay(); if (step &lt; steps().length - 1) { step++; render(); } };
  document.getElementById(&quot;backBtn&quot;).onclick = () =&gt; { stopPlay(); if (step &gt; 0) { step--; render(); } };
  document.getElementById(&quot;resetBtn&quot;).onclick = () =&gt; { stopPlay(); step = 0; render(); };
  document.getElementById(&quot;shuffleBtn&quot;).onclick = () =&gt; {
    stopPlay();
    const set = new Set();
    while (set.size &lt; N) set.add(1 + Math.floor(Math.random() * 99));
    values = [...set];
    build(); step = 0; render();
  };
  document.getElementById(&quot;playBtn&quot;).onclick = () =&gt; {
    if (playing) return stopPlay();
    if (step === steps().length - 1) step = 0;
    document.getElementById(&quot;playBtn&quot;).textContent = &quot;⏸ Pause&quot;;
    render();
    playing = setInterval(() =&gt; {
      if (step &lt; steps().length - 1) { step++; render(); } else stopPlay();
    }, 2200);
  };
  // Arrow keys control whichever tab is open
  document.addEventListener(&quot;keydown&quot;, e =&gt; {
    const bubbleOpen = document.getElementById(&quot;bubbleTab&quot;).classList.contains(&quot;active&quot;);
    if (e.key === &quot;ArrowRight&quot;) document.getElementById(bubbleOpen ? &quot;bNext&quot; : &quot;nextBtn&quot;).click();
    if (e.key === &quot;ArrowLeft&quot;) document.getElementById(bubbleOpen ? &quot;bBack&quot; : &quot;backBtn&quot;).click();
  });


  // High contrast: switched on by the hub (postMessage works even in sandboxed previews)
  window.addEventListener(&quot;message&quot;, e =&gt; {
    if (e.data &amp;&amp; typeof e.data.hc === &quot;boolean&quot;) document.body.classList.toggle(&quot;hc&quot;, e.data.hc);
  });

  // ---------- Tabs ----------
  document.querySelectorAll(&quot;.tab&quot;).forEach(t =&gt; t.onclick = () =&gt; {
    document.querySelectorAll(&quot;.tab&quot;).forEach(x =&gt; x.classList.toggle(&quot;active&quot;, x === t));
    document.querySelectorAll(&quot;.tabpage&quot;).forEach(p =&gt; p.classList.toggle(&quot;active&quot;, p.id === t.dataset.tab));
    stopPlay(); bStop();
  });

  // ================= BUBBLE SORT =================
  let bValues = [38, 27, 43, 3, 9, 82, 10, 5];
  let bFrames = [], bStep = 0, bTimer = null;

  function bBuild() {
    const a = bValues.slice(), n = a.length;
    let comps = 0, swaps = 0;
    const passTotals = [];
    bFrames = [{ type: &quot;start&quot;, arr: a.slice(), comps, swaps, pass: 0, sortedFrom: n, passTotals: [], inPass: 0 }];
    for (let i = 0; i &lt; n - 1; i++) {
      let inPass = 0;
      for (let j = 0; j &lt; n - 1 - i; j++) {
        comps++; inPass++;
        const willSwap = a[j] &gt; a[j + 1];
        bFrames.push({ type: &quot;cmp&quot;, arr: a.slice(), j, comps, swaps, pass: i + 1, sortedFrom: n - i,
                       passTotals: passTotals.slice(), inPass, willSwap });
        if (willSwap) {
          [a[j], a[j + 1]] = [a[j + 1], a[j]];
          swaps++;
          bFrames.push({ type: &quot;swp&quot;, arr: a.slice(), j, comps, swaps, pass: i + 1, sortedFrom: n - i,
                         passTotals: passTotals.slice(), inPass });
        }
      }
      passTotals.push(inPass);
      bFrames.push({ type: &quot;pass&quot;, arr: a.slice(), comps, swaps, pass: i + 1,
                     sortedFrom: i === n - 2 ? 0 : n - 1 - i, passTotals: passTotals.slice(), inPass });
    }
    bFrames.push({ type: &quot;done&quot;, arr: a.slice(), comps, swaps, pass: n - 1, sortedFrom: 0,
                   passTotals: passTotals.slice(), inPass: 0 });
  }

  function bRender() {
    const f = bFrames[bStep], n = f.arr.length, max = Math.max(...f.arr);
    // Bars
    document.getElementById(&quot;bArea&quot;).innerHTML = f.arr.map((v, k) =&gt; {
      let cls = &quot;&quot;;
      if (k &gt;= f.sortedFrom) cls = &quot;done&quot;;
      if ((f.type === &quot;cmp&quot;) &amp;&amp; (k === f.j || k === f.j + 1)) cls = &quot;cmp&quot;;
      if ((f.type === &quot;swp&quot;) &amp;&amp; (k === f.j || k === f.j + 1)) cls = &quot;swp&quot;;
      return `&lt;div class=&quot;bbar ${cls}&quot; style=&quot;height:${30 + (v / max) * 200}px&quot;&gt;${v}&lt;/div&gt;`;
    }).join(&quot;&quot;);

    // Code highlight
    const line = { start: 0, cmp: 3, swp: 4, pass: 1, done: 0 }[f.type];
    document.querySelectorAll(&quot;#bCode .ln&quot;).forEach(l =&gt;
      l.classList.toggle(&quot;on&quot;, Number(l.dataset.l) === line || (f.type === &quot;cmp&quot; &amp;&amp; l.dataset.l === &quot;2&quot;)));

    // Explanation
    const A = f.arr[f.j], B = f.arr[f.j + 1];
    const info = {
      start: [&quot;🫧 Ready&quot;, &quot;The unsorted list&quot;,
        `We have &lt;b&gt;n = ${n}&lt;/b&gt; numbers. Bubble sort compares &lt;b&gt;neighbours&lt;/b&gt; and swaps them if they&#x27;re in the wrong order.
         After each pass, the biggest unsorted number has &quot;bubbled&quot; to the end.`],
      cmp: [`Pass ${f.pass}`, `Compare ${A} and ${B}`,
        f.willSwap ? `${A} &gt; ${B} → &lt;b&gt;wrong order&lt;/b&gt;, so swap them.` : `${A} ≤ ${B} → &lt;b&gt;right order&lt;/b&gt;, leave them.`],
      swp: [`Pass ${f.pass}`, `Swapped!`,
        `The bigger number moves one place to the right.`],
      pass: [`Pass ${f.pass} done`, `${f.arr[n - f.pass]} is in its final place`,
        `This pass made &lt;b&gt;${f.inPass} comparisons&lt;/b&gt;. Each pass needs one fewer, because the end of the list is already sorted.`],
      done: [&quot;✅ Sorted&quot;, &quot;Finished!&quot;,
        `&lt;b&gt;${f.comps} comparisons&lt;/b&gt; and &lt;b&gt;${f.swaps} swaps&lt;/b&gt; for ${n} items.&lt;br&gt;
         Every pass compares neighbours across the list, and there are about n passes: &lt;b&gt;n × n → O(n²)&lt;/b&gt;.`]
    }[f.type];
    document.getElementById(&quot;bTag&quot;).innerHTML = `&lt;span class=&quot;tag ${f.type === &quot;done&quot; ? &quot;merge&quot; : &quot;split&quot;}&quot;&gt;${info[0]}&lt;/span&gt;`;
    document.getElementById(&quot;bTitle&quot;).textContent = info[1];
    document.getElementById(&quot;bExplain&quot;).innerHTML = info[2];
    document.getElementById(&quot;bPass&quot;).textContent = f.pass;
    document.getElementById(&quot;bComp&quot;).textContent = f.comps;
    document.getElementById(&quot;bSwaps&quot;).textContent = f.swaps;

    // Running sum of comparisons per pass
    const parts = f.passTotals.slice();
    if (f.type === &quot;cmp&quot; || f.type === &quot;swp&quot;) parts.push(f.inPass + &quot;…&quot;);
    document.getElementById(&quot;bFormula&quot;).innerHTML = f.type === &quot;done&quot;
      ? `${f.passTotals.join(&quot; + &quot;)} = &lt;span class=&quot;hl&quot;&gt;${f.comps}&lt;/span&gt;&lt;br&gt;&lt;small&gt;= n(n − 1) ÷ 2 → O(n²)&lt;/small&gt;`
      : `comparisons: ${parts.length ? parts.join(&quot; + &quot;) : &quot;0&quot;}`;

    // Comparison grid: row = pass, filled squares = comparisons made
    let g = &quot;&quot;;
    for (let r = 0; r &lt; n - 1; r++) {
      const made = r &lt; f.passTotals.length ? f.passTotals[r]
                 : (r === f.passTotals.length &amp;&amp; (f.type === &quot;cmp&quot; || f.type === &quot;swp&quot;)) ? f.inPass : 0;
      for (let c = 0; c &lt; n; c++) {
        const slot = c &lt; n - 1 - r;
        g += `&lt;div class=&quot;gcell ${c &lt; made ? &quot;fill&quot; : slot ? &quot;slot&quot; : &quot;&quot;}&quot;&gt;&lt;/div&gt;`;
      }
    }
    document.getElementById(&quot;cGrid&quot;).innerHTML = g;

    document.getElementById(&quot;bBack&quot;).disabled = bStep === 0;
    document.getElementById(&quot;bNext&quot;).disabled = bStep === bFrames.length - 1;
  }

  function bStop() { clearInterval(bTimer); bTimer = null; document.getElementById(&quot;bPlay&quot;).textContent = &quot;⏵ Play&quot;; }
  function bPlay() {
    if (bStep === bFrames.length - 1) bStep = 0;
    document.getElementById(&quot;bPlay&quot;).textContent = &quot;⏸ Pause&quot;;
    clearInterval(bTimer);
    bTimer = setInterval(() =&gt; {
      if (bStep &lt; bFrames.length - 1) { bStep++; bRender(); } else bStop();
    }, Number(document.getElementById(&quot;bSpeed&quot;).value));
  }
  document.getElementById(&quot;bNext&quot;).onclick = () =&gt; { bStop(); if (bStep &lt; bFrames.length - 1) { bStep++; bRender(); } };
  document.getElementById(&quot;bBack&quot;).onclick = () =&gt; { bStop(); if (bStep &gt; 0) { bStep--; bRender(); } };
  document.getElementById(&quot;bPlay&quot;).onclick = () =&gt; bTimer ? bStop() : bPlay();
  document.getElementById(&quot;bReset&quot;).onclick = () =&gt; { bStop(); bStep = 0; bRender(); };
  document.getElementById(&quot;bSpeed&quot;).oninput = () =&gt; { if (bTimer) bPlay(); };
  const bNew = arr =&gt; { bStop(); bValues = arr; bBuild(); bStep = 0; bRender(); };
  document.getElementById(&quot;bRandom&quot;).onclick = () =&gt; {
    const s = new Set(); while (s.size &lt; 8) s.add(1 + Math.floor(Math.random() * 99));
    bNew([...s]);
  };
  document.getElementById(&quot;bWorst&quot;).onclick = () =&gt; bNew([90, 80, 70, 60, 50, 40, 30, 20]);
  bBuild(); bRender();

  // ---------- Compare slider ----------
  const fmt = x =&gt; x &gt;= 1e12 ? (x / 1e12).toFixed(1) + &quot; trillion&quot;
                 : x &gt;= 1e9 ? (x / 1e9).toFixed(1) + &quot; billion&quot;
                 : x &gt;= 1e6 ? (x / 1e6).toFixed(1) + &quot; million&quot;
                 : Math.round(x).toLocaleString();
  function updateCompare() {
    const p = Number(document.getElementById(&quot;nSlider&quot;).value);
    const n = 2 ** p;
    const good = n * p, bad = n * n;
    document.getElementById(&quot;nLabel&quot;).textContent = n.toLocaleString();
    // log scale so both bars stay visible
    const scale = x =&gt; Math.log10(x + 1) / Math.log10(bad + 1) * 100;
    document.getElementById(&quot;goodBar&quot;).style.width = scale(good) + &quot;%&quot;;
    document.getElementById(&quot;badBar&quot;).style.width = &quot;100%&quot;;
    document.getElementById(&quot;goodNum&quot;).textContent = fmt(good);
    document.getElementById(&quot;badNum&quot;).textContent = fmt(bad);
    const ratio = bad / good;
    document.getElementById(&quot;verdict&quot;).innerHTML =
      `${n.toLocaleString()} items: ${n.toLocaleString()} × ${p} = ${fmt(good)} steps vs ${n.toLocaleString()}² = ${fmt(bad)} steps.&lt;br&gt;
       Bubble sort does &lt;b&gt;${fmt(ratio)}× more work&lt;/b&gt;.`;
  }
  document.getElementById(&quot;nSlider&quot;).oninput = updateCompare;

  build(); render(); updateCompare();
&lt;/script&gt;
&lt;script&gt;document.querySelector(&#x27;.tab[data-tab=&quot;mergeTab&quot;]&#x27;).click();&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
    <iframe id="bubble" title="Bubble sort" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;Merge Sort – Where does n log n come from?&lt;/title&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
  :root{
    --bg:#f8fafc; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --panel:#ffffff;
    --split:#2563eb; --split-bg:#dbeafe; --merge:#16a34a; --merge-bg:#dcfce7;
    --bad:#dc2626; --bad-bg:#fee2e2; --accent:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:&quot;Fredoka&quot;,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:20px 24px 4px;text-align:center}
  header h1{margin:0;font-size:clamp(1.6rem,3.5vw,2.4rem)}
  header p{margin:6px 0 0;color:var(--muted);font-size:1.1rem}
  .mono{font-family:&quot;JetBrains Mono&quot;,monospace}
  main{max-width:1200px;margin:0 auto;padding:16px 20px 40px;display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px}

  /* ---------- Visual ---------- */
  .row{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px;padding:6px 0;transition:opacity .4s}
  .row.hidden{opacity:0;pointer-events:none}
  .row.current .label{color:var(--ink);font-weight:700}
  .label{font-size:.9rem;color:var(--muted);line-height:1.2}
  .label b{display:block;font-size:1rem}
  .groups{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .group{display:flex;gap:4px;padding:5px;border-radius:12px;border:2px solid}

  .cell{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;

  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem;margin:6px 0}
  .divider::before,.divider::after{content:&quot;&quot;;flex:1;height:2px;background:var(--line)}

  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  button{font:inherit;font-weight:600;font-size:1rem;border:2px solid var(--ink);border-radius:12px;padding:9px 16px;cursor:pointer;background:#fff}
  button.primary{background:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .progress{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--ink)}

  /* ---------- Explanation ---------- */
  .step-title{font-size:1.35rem;margin:0 0 8px}
  .explain{font-size:1.08rem;line-height:1.55;min-height:150px}
  .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:600;margin-bottom:8px}
  .tag.split{background:var(--split-bg);color:var(--split)}
  .tag.merge{background:var(--merge-bg);color:var(--merge)}
  .tag.sum{background:#fef3c7;color:#92400e}

  .meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .meter{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
  .meter .big{font-size:2rem;font-weight:700;font-family:&quot;JetBrains Mono&quot;,monospace}
  .meter small{color:var(--muted)}
  .formula{margin-top:12px;font-family:&quot;JetBrains Mono&quot;,monospace;font-size:1.05rem;background:#0f172a;color:#e2e8f0;
           border-radius:12px;padding:12px;text-align:center}
  .formula .hl{color:#fbbf24;font-weight:700}

  /* ---------- Compare ---------- */
  .compare{grid-column:1 / -1}
  .bars{margin-top:10px;display:grid;gap:10px}
  .bar-row{display:grid;grid-template-columns:170px 1fr 140px;align-items:center;gap:10px}
  @media(max-width:600px){.bar-row{grid-template-columns:110px 1fr 90px}}
  .track{height:30px;background:var(--line);border-radius:10px;overflow:hidden}
  .fill{height:100%;border-radius:10px;transition:width .5s}
  .fill.good{background:var(--merge)} .fill.bad{background:var(--bad)}
  .num{font-family:&quot;JetBrains Mono&quot;,monospace;font-weight:700;text-align:right}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .verdict{margin-top:12px;font-size:1.15rem;text-align:center}
  .verdict b{color:var(--bad)}
  .note{color:var(--muted);font-size:.9rem;margin-top:8px}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;justify-content:center;gap:10px;padding:16px 16px 0;flex-wrap:wrap}
  .tab{border-radius:999px}
  .tab.active{background:var(--ink);color:#fff}
  .tabpage{display:none}
  .tabpage.active{display:block}

  /* ---------- Bubble sort ---------- */
  .bars-area{height:260px;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:10px;border-bottom:3px solid var(--line)}
  .bbar{width:52px;border-radius:10px 10px 4px 4px;background:#94a3b8;display:flex;align-items:flex-start;justify-content:center;
        color:#fff;font-family:&quot;JetBrains Mono&quot;,monospace;font-weight:700;padding-top:6px;transition:height .3s,background .2s}
  .bbar.cmp{background:#f59e0b} .bbar.swp{background:#dc2626} .bbar.done{background:#16a34a}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:8px;color:var(--muted);font-size:.9rem}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .codebox{margin-top:14px;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;font-family:&quot;JetBrains Mono&quot;,monospace;
           font-size:.92rem;line-height:1.7;overflow-x:auto}
  .codebox .ln{display:block;border-radius:6px;padding:0 6px;white-space:pre}
  .codebox .ln.on{background:#334155}
  .k{color:#f472b6} .c{color:#64748b}
  .gridwrap{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
  @media(max-width:700px){.gridwrap{grid-template-columns:1fr}}
  .cgrid{display:grid;grid-template-columns:repeat(8,34px);gap:4px}
  .gcell{width:34px;height:34px;border-radius:6px;background:var(--line);transition:background .3s}

  /* ---------- High contrast mode (for visual impairment) ---------- */

  body.hc header h1, body.hc .step-title{color:#fff !important}

  body.hc .bbar.swp{background:#ff5252;color:#000}

&lt;body&gt;

&lt;nav class=&quot;tabs&quot;&gt;
  &lt;button class=&quot;tab active&quot; data-tab=&quot;mergeTab&quot;&gt;🔀 Merge sort · O(n log n)&lt;/button&gt;
  &lt;button class=&quot;tab&quot; data-tab=&quot;bubbleTab&quot;&gt;🫧 Bubble sort · O(n²)&lt;/button&gt;

&lt;section id=&quot;mergeTab&quot; class=&quot;tabpage active&quot;&gt;
&lt;header&gt;
  &lt;h1&gt;🔀 Merge Sort: where does &lt;span class=&quot;mono&quot;&gt;n log n&lt;/span&gt; come from?&lt;/h1&gt;
  &lt;p&gt;Sorting 8 items, step by step.&lt;/p&gt;
&lt;/header&gt;

&lt;main&gt;
  &lt;!-- ================= Visual ================= --&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div id=&quot;visual&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;

      &lt;button id=&quot;nextBtn&quot; class=&quot;primary&quot;&gt;Next ▶&lt;/button&gt;

  &lt;/div&gt;

  &lt;!-- ================= Explanation ================= --&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div id=&quot;tag&quot;&gt;&lt;/div&gt;
    &lt;h2 class=&quot;step-title&quot; id=&quot;stepTitle&quot;&gt;&lt;/h2&gt;
    &lt;div class=&quot;explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;meters&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;levelsMeter&quot;&gt;0&lt;/div&gt;&lt;small&gt;split levels&lt;br&gt;(this is &lt;b&gt;log n&lt;/b&gt;)&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;workMeter&quot;&gt;0&lt;/div&gt;&lt;small&gt;work done&lt;br&gt;(items handled)&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot; id=&quot;formula&quot;&gt;n × log n = 8 × ? = ?&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ================= Compare ================= --&gt;
  &lt;div class=&quot;panel compare&quot;&gt;
    &lt;h2 class=&quot;step-title&quot;&gt;📈 Why it matters: merge sort vs bubble sort&lt;/h2&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin-top:0&quot;&gt;Drag the slider to make the list bigger and compare the amount of work.&lt;/p&gt;
    &lt;label for=&quot;nSlider&quot;&gt;&lt;b&gt;Number of items: &lt;span class=&quot;mono&quot; id=&quot;nLabel&quot;&gt;8&lt;/span&gt;&lt;/b&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;nSlider&quot; min=&quot;3&quot; max=&quot;20&quot; value=&quot;3&quot;&gt;
    &lt;div class=&quot;bars&quot;&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;Merge sort&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;O(n log n)&lt;/span&gt;&lt;/span&gt;
        &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill good&quot; id=&quot;goodBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot; id=&quot;goodNum&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;Bubble sort&lt;br&gt;&lt;span class=&quot;mono&quot;&gt;O(n²)&lt;/span&gt;&lt;/span&gt;
        &lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; id=&quot;badBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot; id=&quot;badNum&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;verdict&quot; id=&quot;verdict&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;Bars use a logarithmic scale for large lists, otherwise the merge sort bar would be too small to see!&lt;/p&gt;

&lt;/section&gt;

&lt;!-- ======================= BUBBLE SORT TAB ======================= --&gt;
&lt;section id=&quot;bubbleTab&quot; class=&quot;tabpage&quot;&gt;
&lt;header&gt;
  &lt;h1&gt;🫧 Bubble Sort: why is it &lt;span class=&quot;mono&quot;&gt;O(n²)&lt;/span&gt;?&lt;/h1&gt;
  &lt;p&gt;Compare neighbours, swap if they&#x27;re in the wrong order, repeat.&lt;/p&gt;
&lt;/header&gt;
&lt;main&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;bars-area&quot; id=&quot;bArea&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;
      &lt;span&gt;&lt;i style=&quot;background:#f59e0b&quot;&gt;&lt;/i&gt;comparing&lt;/span&gt;
      &lt;span&gt;&lt;i style=&quot;background:#dc2626&quot;&gt;&lt;/i&gt;swapping&lt;/span&gt;
      &lt;span&gt;&lt;i style=&quot;background:#16a34a&quot;&gt;&lt;/i&gt;in final place&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;
      &lt;button id=&quot;bBack&quot;&gt;◀ Back&lt;/button&gt;
      &lt;button id=&quot;bNext&quot; class=&quot;primary&quot;&gt;Next ▶&lt;/button&gt;
      &lt;button id=&quot;bPlay&quot;&gt;⏵ Play&lt;/button&gt;
      &lt;button id=&quot;bReset&quot;&gt;↺ Reset&lt;/button&gt;
      &lt;button id=&quot;bRandom&quot;&gt;🎲 Random&lt;/button&gt;
      &lt;button id=&quot;bWorst&quot;&gt;⬇ Worst case&lt;/button&gt;
    &lt;/div&gt;
    &lt;label class=&quot;note&quot; style=&quot;display:block;text-align:center;margin-top:10px&quot;&gt;Speed
      &lt;input type=&quot;range&quot; id=&quot;bSpeed&quot; min=&quot;100&quot; max=&quot;1500&quot; value=&quot;700&quot; style=&quot;width:160px;vertical-align:middle;direction:rtl&quot;&gt;
    &lt;/label&gt;

    &lt;div class=&quot;codebox&quot; id=&quot;bCode&quot;&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;1&quot;&gt;&lt;span class=&quot;k&quot;&gt;for&lt;/span&gt; i &lt;span class=&quot;k&quot;&gt;in&lt;/span&gt; range(n - 1):            &lt;span class=&quot;c&quot;&gt;# outer loop: one pass each time&lt;/span&gt;&lt;/span&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;2&quot;&gt;    &lt;span class=&quot;k&quot;&gt;for&lt;/span&gt; j &lt;span class=&quot;k&quot;&gt;in&lt;/span&gt; range(n - 1 - i):    &lt;span class=&quot;c&quot;&gt;# inner loop: compare neighbours&lt;/span&gt;&lt;/span&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;3&quot;&gt;        &lt;span class=&quot;k&quot;&gt;if&lt;/span&gt; items[j] &gt; items[j + 1]:&lt;/span&gt;
      &lt;span class=&quot;ln&quot; data-l=&quot;4&quot;&gt;            items[j], items[j + 1] = items[j + 1], items[j]   &lt;span class=&quot;c&quot;&gt;# swap&lt;/span&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;
    &lt;div id=&quot;bTag&quot;&gt;&lt;/div&gt;
    &lt;h2 class=&quot;step-title&quot; id=&quot;bTitle&quot;&gt;&lt;/h2&gt;
    &lt;div class=&quot;explain&quot; id=&quot;bExplain&quot; style=&quot;min-height:110px&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;meters&quot; style=&quot;grid-template-columns:1fr 1fr 1fr&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;bPass&quot;&gt;0&lt;/div&gt;&lt;small&gt;pass&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;bComp&quot;&gt;0&lt;/div&gt;&lt;small&gt;comparisons&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;bSwaps&quot;&gt;0&lt;/div&gt;&lt;small&gt;swaps&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula&quot; id=&quot;bFormula&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;panel compare&quot;&gt;
    &lt;h2 class=&quot;step-title&quot;&gt;🟧 The comparison grid: why it&#x27;s &quot;about n²&quot;&lt;/h2&gt;
    &lt;p class=&quot;note&quot; style=&quot;margin-top:0&quot;&gt;Each square is one comparison. Row 1 is pass 1, row 2 is pass 2, and so on. Watch the squares fill as the sort runs.&lt;/p&gt;
    &lt;div class=&quot;gridwrap&quot;&gt;
      &lt;div class=&quot;cgrid&quot; id=&quot;cGrid&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;gridtext&quot;&gt;
        &lt;p&gt;Pass 1 makes &lt;b&gt;7&lt;/b&gt; comparisons, pass 2 makes &lt;b&gt;6&lt;/b&gt;, then 5, 4, 3, 2, 1.&lt;/p&gt;
        &lt;p class=&quot;mono&quot; style=&quot;font-size:1.1rem&quot;&gt;7+6+5+4+3+2+1 = &lt;b&gt;28&lt;/b&gt;&lt;/p&gt;
        &lt;p&gt;The filled squares make a &lt;b&gt;triangle&lt;/b&gt;: about &lt;b&gt;half&lt;/b&gt; of an n × n square.&lt;/p&gt;
        &lt;p class=&quot;mono&quot; style=&quot;font-size:1.1rem&quot;&gt;n(n − 1) ÷ 2 = (n² − n) ÷ 2&lt;/p&gt;
        &lt;p&gt;Big O rules:&lt;br&gt;1️⃣ keep the fastest-growing term → &lt;span class=&quot;mono&quot;&gt;n²&lt;/span&gt;&lt;br&gt;2️⃣ drop the constant ÷ 2 →
          &lt;b class=&quot;mono&quot; style=&quot;font-size:1.3rem&quot;&gt;O(n²)&lt;/b&gt;&lt;/p&gt;
        &lt;p class=&quot;note&quot;&gt;💡 The &lt;b&gt;nested loops&lt;/b&gt; are the clue: a loop inside a loop, and both depend on n.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;bars&quot; style=&quot;margin-top:18px&quot;&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;8 items&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; style=&quot;width:0.28%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot;&gt;28&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;100 items&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; style=&quot;width:4.95%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot;&gt;4,950&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-row&quot;&gt;&lt;span&gt;1,000 items&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill bad&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;num&quot;&gt;499,500&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;note&quot;&gt;10× more items → about &lt;b&gt;100× more comparisons&lt;/b&gt;. That&#x27;s what n² growth feels like.&lt;/p&gt;
  &lt;/div&gt;
&lt;/main&gt;
&lt;/section&gt;

&lt;script&gt;
  const N = 8;
  let values = [38, 27, 43, 3, 9, 82, 10, 5];
  let splitRows = [], mergeRows = [];
  let step = 0, playing = null;

  // ---------- Build the split and merge levels ----------
  function build() {
    splitRows = [[values.slice()]];
    while (splitRows[splitRows.length - 1].some(g =&gt; g.length &gt; 1)) {
      const prev = splitRows[splitRows.length - 1];
      splitRows.push(prev.flatMap(g =&gt; {
        if (g.length === 1) return [g];
        const mid = Math.ceil(g.length / 2);
        return [g.slice(0, mid), g.slice(mid)];
      }));
    }
    mergeRows = [];
    let current = splitRows[splitRows.length - 1];
    while (current.length &gt; 1) {
      const next = [];
      for (let i = 0; i &lt; current.length; i += 2) {
        next.push(i + 1 &lt; current.length ? merge(current[i], current[i + 1]) : current[i]);
      }
      mergeRows.push(next);
      current = next;
    }
  }
  function merge(a, b) {
    const out = []; let i = 0, j = 0;
    while (i &lt; a.length &amp;&amp; j &lt; b.length) out.push(a[i] &lt;= b[j] ? a[i++] : b[j++]);
    return out.concat(a.slice(i), b.slice(j));
  }

  // Colour each number by its size: small = cool, big = warm
  function colour(v) {
    const min = Math.min(...values), max = Math.max(...values);
    const t = max === min ? 0.5 : (v - min) / (max - min);
    return `hsl(${220 - t * 200}, 70%, 50%)`;
  }

  // ---------- Steps (one per frame) ----------
  const LOG = Math.log2(N); // 3
  function steps() {
    return [
      { kind: &quot;split&quot;, show: 0, title: &quot;The unsorted list&quot;,
        text: `We have &lt;b&gt;n = 8&lt;/b&gt; numbers to sort. Merge sort works in two parts:&lt;br&gt;
               &lt;b style=&quot;color:var(--split)&quot;&gt;1. Split&lt;/b&gt; the list in half again and again.&lt;br&gt;
               &lt;b style=&quot;color:var(--merge)&quot;&gt;2. Merge&lt;/b&gt; the pieces back together in order.` },
      { kind: &quot;split&quot;, show: 1, title: &quot;Split level 1&quot;,
        text: `Cut the list in half: &lt;b&gt;8 → 4 + 4&lt;/b&gt;.&lt;br&gt;Each half is now a smaller sorting problem.` },
      { kind: &quot;split&quot;, show: 2, title: &quot;Split level 2&quot;,
        text: `Cut each half in half again: &lt;b&gt;4 → 2 + 2&lt;/b&gt;.` },
      { kind: &quot;split&quot;, show: 3, title: &quot;Split level 3: single items&quot;,
        text: `Now every piece holds &lt;b&gt;1 item&lt;/b&gt; – and a list of 1 item is already sorted!&lt;br&gt;&lt;br&gt;
               We halved &lt;b&gt;3 times&lt;/b&gt;: 8 → 4 → 2 → 1.&lt;br&gt;That&#x27;s &lt;b&gt;log₂ 8 = 3&lt;/b&gt;, because 2³ = 8.
               &lt;br&gt;👉 &lt;b&gt;This is where log n comes from.&lt;/b&gt;` },
      { kind: &quot;merge&quot;, show: 4, title: &quot;Merge level 1: pairs&quot;,
        text: `Merge the single items into &lt;b&gt;sorted pairs&lt;/b&gt;, always taking the smaller front item first.&lt;br&gt;&lt;br&gt;
               All &lt;b&gt;8 items&lt;/b&gt; are handled at this level.` },
      { kind: &quot;merge&quot;, show: 5, title: &quot;Merge level 2: fours&quot;,
        text: `Merge the pairs into &lt;b&gt;sorted groups of 4&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               Again, all &lt;b&gt;8 items&lt;/b&gt; are handled.` },
      { kind: &quot;merge&quot;, show: 6, title: &quot;Merge level 3: sorted! ✅&quot;,
        text: `Merge the two groups of 4 into &lt;b&gt;one sorted list&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               All &lt;b&gt;8 items&lt;/b&gt; handled again.&lt;br&gt;👉 &lt;b&gt;Every level touches all n items. This is where the n comes from.&lt;/b&gt;` },
      { kind: &quot;sum&quot;, show: 6, title: &quot;Putting it together&quot;,
        text: `&lt;b&gt;3 levels&lt;/b&gt; (log n) × &lt;b&gt;8 items per level&lt;/b&gt; (n) = &lt;b&gt;24 steps&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               Bubble sort compares items over and over: about &lt;b&gt;8 × 8 = 64 steps&lt;/b&gt;.&lt;br&gt;&lt;br&gt;
               Small difference with 8 items… now try the slider below with a &lt;b&gt;million&lt;/b&gt;!` }
    ];
  }

  // ---------- Render ----------
  function rowHTML(groups, kind, label, sub, visible, current) {
    const gs = groups.map(g =&gt; `&lt;div class=&quot;group&quot;&gt;${
      g.map(v =&gt; `&lt;div class=&quot;cell&quot; style=&quot;background:${colour(v)}&quot;&gt;${v}&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;`).join(&quot;&quot;);
    return `&lt;div class=&quot;row ${kind} ${visible ? &quot;&quot; : &quot;hidden&quot;} ${current ? &quot;current&quot; : &quot;&quot;}&quot;&gt;
      &lt;div class=&quot;label&quot;&gt;&lt;b&gt;${label}&lt;/b&gt;${sub}&lt;/div&gt;&lt;div class=&quot;groups&quot;&gt;${gs}&lt;/div&gt;&lt;/div&gt;`;
  }

  function render() {
    const s = steps()[step];
    const v = document.getElementById(&quot;visual&quot;);
    let html = &quot;&quot;;
    splitRows.forEach((r, i) =&gt; {
      html += rowHTML(r, &quot;split&quot;, i === 0 ? &quot;Start&quot; : `Split ${i}`,
        i === 0 ? &quot;1 list&quot; : `${r.length} pieces`, s.show &gt;= i, s.show === i &amp;&amp; s.kind === &quot;split&quot;);
    });
    html += `&lt;div class=&quot;divider ${s.show &gt;= 4 ? &quot;&quot; : &quot;hidden&quot;}&quot;&gt;now merge back up ⬇&lt;/div&gt;`;
    mergeRows.forEach((r, i) =&gt; {
      const idx = splitRows.length + i;
      html += rowHTML(r, &quot;merge&quot;, `Merge ${i + 1}`, `8 items handled`,
        s.show &gt;= idx, s.show === idx &amp;&amp; s.kind === &quot;merge&quot;);
    });
    v.innerHTML = html;

    // Explanation panel
    const tagText = { split: &quot;✂️ Splitting&quot;, merge: &quot;🔗 Merging&quot;, sum: &quot;🧮 Summary&quot; }[s.kind];
    document.getElementById(&quot;tag&quot;).innerHTML = `&lt;span class=&quot;tag ${s.kind}&quot;&gt;${tagText}&lt;/span&gt;`;
    document.getElementById(&quot;stepTitle&quot;).textContent = s.title;
    document.getElementById(&quot;explain&quot;).innerHTML = s.text;

    const levels = Math.min(s.show, LOG);
    const mergesDone = Math.max(0, s.show - LOG);
    const work = mergesDone * N;
    document.getElementById(&quot;levelsMeter&quot;).textContent = levels;
    document.getElementById(&quot;workMeter&quot;).textContent = work;

    const parts = Array.from({ length: mergesDone }, () =&gt; N).join(&quot; + &quot;) || &quot;0&quot;;
    document.getElementById(&quot;formula&quot;).innerHTML = mergesDone === LOG
      ? `n × log n = 8 × 3 = &lt;span class=&quot;hl&quot;&gt;24&lt;/span&gt;&lt;br&gt;&lt;small&gt;(${parts})&lt;/small&gt;`
      : `work so far: ${parts}${mergesDone ? &quot; = &quot; + work : &quot;&quot;}`;

    document.getElementById(&quot;progress&quot;).innerHTML =
      steps().map((_, i) =&gt; `&lt;div class=&quot;dot ${i &lt;= step ? &quot;on&quot; : &quot;&quot;}&quot;&gt;&lt;/div&gt;`).join(&quot;&quot;);
    document.getElementById(&quot;backBtn&quot;).disabled = step === 0;
    document.getElementById(&quot;nextBtn&quot;).disabled = step === steps().length - 1;
  }

  // ---------- Controls ----------
  function stopPlay() { clearInterval(playing); playing = null; document.getElementById(&quot;playBtn&quot;).textContent = &quot;⏵ Play all&quot;; }
  document.getElementById(&quot;nextBtn&quot;).onclick = () =&gt; { stopPlay(); if (step &lt; steps().length - 1) { step++; render(); } };
  document.getElementById(&quot;backBtn&quot;).onclick = () =&gt; { stopPlay(); if (step &gt; 0) { step--; render(); } };
  document.getElementById(&quot;resetBtn&quot;).onclick = () =&gt; { stopPlay(); step = 0; render(); };
  document.getElementById(&quot;shuffleBtn&quot;).onclick = () =&gt; {
    stopPlay();
    const set = new Set();
    while (set.size &lt; N) set.add(1 + Math.floor(Math.random() * 99));
    values = [...set];
    build(); step = 0; render();
  };
  document.getElementById(&quot;playBtn&quot;).onclick = () =&gt; {
    if (playing) return stopPlay();
    if (step === steps().length - 1) step = 0;
    document.getElementById(&quot;playBtn&quot;).textContent = &quot;⏸ Pause&quot;;
    render();
    playing = setInterval(() =&gt; {
      if (step &lt; steps().length - 1) { step++; render(); } else stopPlay();
    }, 2200);
  };
  // Arrow keys control whichever tab is open
  document.addEventListener(&quot;keydown&quot;, e =&gt; {
    const bubbleOpen = document.getElementById(&quot;bubbleTab&quot;).classList.contains(&quot;active&quot;);
    if (e.key === &quot;ArrowRight&quot;) document.getElementById(bubbleOpen ? &quot;bNext&quot; : &quot;nextBtn&quot;).click();
    if (e.key === &quot;ArrowLeft&quot;) document.getElementById(bubbleOpen ? &quot;bBack&quot; : &quot;backBtn&quot;).click();
  });


  // High contrast: switched on by the hub (postMessage works even in sandboxed previews)
  window.addEventListener(&quot;message&quot;, e =&gt; {
    if (e.data &amp;&amp; typeof e.data.hc === &quot;boolean&quot;) document.body.classList.toggle(&quot;hc&quot;, e.data.hc);
  });

  // ---------- Tabs ----------
  document.querySelectorAll(&quot;.tab&quot;).forEach(t =&gt; t.onclick = () =&gt; {
    document.querySelectorAll(&quot;.tab&quot;).forEach(x =&gt; x.classList.toggle(&quot;active&quot;, x === t));
    document.querySelectorAll(&quot;.tabpage&quot;).forEach(p =&gt; p.classList.toggle(&quot;active&quot;, p.id === t.dataset.tab));
    stopPlay(); bStop();
  });

  // ================= BUBBLE SORT =================
  let bValues = [38, 27, 43, 3, 9, 82, 10, 5];
  let bFrames = [], bStep = 0, bTimer = null;

  function bBuild() {
    const a = bValues.slice(), n = a.length;
    let comps = 0, swaps = 0;
    const passTotals = [];
    bFrames = [{ type: &quot;start&quot;, arr: a.slice(), comps, swaps, pass: 0, sortedFrom: n, passTotals: [], inPass: 0 }];
    for (let i = 0; i &lt; n - 1; i++) {
      let inPass = 0;
      for (let j = 0; j &lt; n - 1 - i; j++) {
        comps++; inPass++;
        const willSwap = a[j] &gt; a[j + 1];
        bFrames.push({ type: &quot;cmp&quot;, arr: a.slice(), j, comps, swaps, pass: i + 1, sortedFrom: n - i,
                       passTotals: passTotals.slice(), inPass, willSwap });
        if (willSwap) {
          [a[j], a[j + 1]] = [a[j + 1], a[j]];
          swaps++;
          bFrames.push({ type: &quot;swp&quot;, arr: a.slice(), j, comps, swaps, pass: i + 1, sortedFrom: n - i,
                         passTotals: passTotals.slice(), inPass });
        }
      }
      passTotals.push(inPass);
      bFrames.push({ type: &quot;pass&quot;, arr: a.slice(), comps, swaps, pass: i + 1,
                     sortedFrom: i === n - 2 ? 0 : n - 1 - i, passTotals: passTotals.slice(), inPass });
    }
    bFrames.push({ type: &quot;done&quot;, arr: a.slice(), comps, swaps, pass: n - 1, sortedFrom: 0,
                   passTotals: passTotals.slice(), inPass: 0 });
  }

  function bRender() {
    const f = bFrames[bStep], n = f.arr.length, max = Math.max(...f.arr);
    // Bars
    document.getElementById(&quot;bArea&quot;).innerHTML = f.arr.map((v, k) =&gt; {
      let cls = &quot;&quot;;
      if (k &gt;= f.sortedFrom) cls = &quot;done&quot;;
      if ((f.type === &quot;cmp&quot;) &amp;&amp; (k === f.j || k === f.j + 1)) cls = &quot;cmp&quot;;
      if ((f.type === &quot;swp&quot;) &amp;&amp; (k === f.j || k === f.j + 1)) cls = &quot;swp&quot;;
      return `&lt;div class=&quot;bbar ${cls}&quot; style=&quot;height:${30 + (v / max) * 200}px&quot;&gt;${v}&lt;/div&gt;`;
    }).join(&quot;&quot;);

    // Code highlight
    const line = { start: 0, cmp: 3, swp: 4, pass: 1, done: 0 }[f.type];
    document.querySelectorAll(&quot;#bCode .ln&quot;).forEach(l =&gt;
      l.classList.toggle(&quot;on&quot;, Number(l.dataset.l) === line || (f.type === &quot;cmp&quot; &amp;&amp; l.dataset.l === &quot;2&quot;)));

    // Explanation
    const A = f.arr[f.j], B = f.arr[f.j + 1];
    const info = {
      start: [&quot;🫧 Ready&quot;, &quot;The unsorted list&quot;,
        `We have &lt;b&gt;n = ${n}&lt;/b&gt; numbers. Bubble sort compares &lt;b&gt;neighbours&lt;/b&gt; and swaps them if they&#x27;re in the wrong order.
         After each pass, the biggest unsorted number has &quot;bubbled&quot; to the end.`],
      cmp: [`Pass ${f.pass}`, `Compare ${A} and ${B}`,
        f.willSwap ? `${A} &gt; ${B} → &lt;b&gt;wrong order&lt;/b&gt;, so swap them.` : `${A} ≤ ${B} → &lt;b&gt;right order&lt;/b&gt;, leave them.`],
      swp: [`Pass ${f.pass}`, `Swapped!`,
        `The bigger number moves one place to the right.`],
      pass: [`Pass ${f.pass} done`, `${f.arr[n - f.pass]} is in its final place`,
        `This pass made &lt;b&gt;${f.inPass} comparisons&lt;/b&gt;. Each pass needs one fewer, because the end of the list is already sorted.`],
      done: [&quot;✅ Sorted&quot;, &quot;Finished!&quot;,
        `&lt;b&gt;${f.comps} comparisons&lt;/b&gt; and &lt;b&gt;${f.swaps} swaps&lt;/b&gt; for ${n} items.&lt;br&gt;
         Every pass compares neighbours across the list, and there are about n passes: &lt;b&gt;n × n → O(n²)&lt;/b&gt;.`]
    }[f.type];
    document.getElementById(&quot;bTag&quot;).innerHTML = `&lt;span class=&quot;tag ${f.type === &quot;done&quot; ? &quot;merge&quot; : &quot;split&quot;}&quot;&gt;${info[0]}&lt;/span&gt;`;
    document.getElementById(&quot;bTitle&quot;).textContent = info[1];
    document.getElementById(&quot;bExplain&quot;).innerHTML = info[2];
    document.getElementById(&quot;bPass&quot;).textContent = f.pass;
    document.getElementById(&quot;bComp&quot;).textContent = f.comps;
    document.getElementById(&quot;bSwaps&quot;).textContent = f.swaps;

    // Running sum of comparisons per pass
    const parts = f.passTotals.slice();
    if (f.type === &quot;cmp&quot; || f.type === &quot;swp&quot;) parts.push(f.inPass + &quot;…&quot;);
    document.getElementById(&quot;bFormula&quot;).innerHTML = f.type === &quot;done&quot;
      ? `${f.passTotals.join(&quot; + &quot;)} = &lt;span class=&quot;hl&quot;&gt;${f.comps}&lt;/span&gt;&lt;br&gt;&lt;small&gt;= n(n − 1) ÷ 2 → O(n²)&lt;/small&gt;`
      : `comparisons: ${parts.length ? parts.join(&quot; + &quot;) : &quot;0&quot;}`;

    // Comparison grid: row = pass, filled squares = comparisons made
    let g = &quot;&quot;;
    for (let r = 0; r &lt; n - 1; r++) {
      const made = r &lt; f.passTotals.length ? f.passTotals[r]
                 : (r === f.passTotals.length &amp;&amp; (f.type === &quot;cmp&quot; || f.type === &quot;swp&quot;)) ? f.inPass : 0;
      for (let c = 0; c &lt; n; c++) {
        const slot = c &lt; n - 1 - r;
        g += `&lt;div class=&quot;gcell ${c &lt; made ? &quot;fill&quot; : slot ? &quot;slot&quot; : &quot;&quot;}&quot;&gt;&lt;/div&gt;`;
      }
    }
    document.getElementById(&quot;cGrid&quot;).innerHTML = g;

    document.getElementById(&quot;bBack&quot;).disabled = bStep === 0;
    document.getElementById(&quot;bNext&quot;).disabled = bStep === bFrames.length - 1;
  }

  function bStop() { clearInterval(bTimer); bTimer = null; document.getElementById(&quot;bPlay&quot;).textContent = &quot;⏵ Play&quot;; }
  function bPlay() {
    if (bStep === bFrames.length - 1) bStep = 0;
    document.getElementById(&quot;bPlay&quot;).textContent = &quot;⏸ Pause&quot;;
    clearInterval(bTimer);
    bTimer = setInterval(() =&gt; {
      if (bStep &lt; bFrames.length - 1) { bStep++; bRender(); } else bStop();
    }, Number(document.getElementById(&quot;bSpeed&quot;).value));
  }
  document.getElementById(&quot;bNext&quot;).onclick = () =&gt; { bStop(); if (bStep &lt; bFrames.length - 1) { bStep++; bRender(); } };
  document.getElementById(&quot;bBack&quot;).onclick = () =&gt; { bStop(); if (bStep &gt; 0) { bStep--; bRender(); } };
  document.getElementById(&quot;bPlay&quot;).onclick = () =&gt; bTimer ? bStop() : bPlay();
  document.getElementById(&quot;bReset&quot;).onclick = () =&gt; { bStop(); bStep = 0; bRender(); };
  document.getElementById(&quot;bSpeed&quot;).oninput = () =&gt; { if (bTimer) bPlay(); };
  const bNew = arr =&gt; { bStop(); bValues = arr; bBuild(); bStep = 0; bRender(); };
  document.getElementById(&quot;bRandom&quot;).onclick = () =&gt; {
    const s = new Set(); while (s.size &lt; 8) s.add(1 + Math.floor(Math.random() * 99));
    bNew([...s]);
  };
  document.getElementById(&quot;bWorst&quot;).onclick = () =&gt; bNew([90, 80, 70, 60, 50, 40, 30, 20]);
  bBuild(); bRender();

  // ---------- Compare slider ----------
  const fmt = x =&gt; x &gt;= 1e12 ? (x / 1e12).toFixed(1) + &quot; trillion&quot;
                 : x &gt;= 1e9 ? (x / 1e9).toFixed(1) + &quot; billion&quot;
                 : x &gt;= 1e6 ? (x / 1e6).toFixed(1) + &quot; million&quot;
                 : Math.round(x).toLocaleString();
  function updateCompare() {
    const p = Number(document.getElementById(&quot;nSlider&quot;).value);
    const n = 2 ** p;
    const good = n * p, bad = n * n;
    document.getElementById(&quot;nLabel&quot;).textContent = n.toLocaleString();
    // log scale so both bars stay visible
    const scale = x =&gt; Math.log10(x + 1) / Math.log10(bad + 1) * 100;
    document.getElementById(&quot;goodBar&quot;).style.width = scale(good) + &quot;%&quot;;
    document.getElementById(&quot;badBar&quot;).style.width = &quot;100%&quot;;
    document.getElementById(&quot;goodNum&quot;).textContent = fmt(good);
    document.getElementById(&quot;badNum&quot;).textContent = fmt(bad);
    const ratio = bad / good;
    document.getElementById(&quot;verdict&quot;).innerHTML =
      `${n.toLocaleString()} items: ${n.toLocaleString()} × ${p} = ${fmt(good)} steps vs ${n.toLocaleString()}² = ${fmt(bad)} steps.&lt;br&gt;
       Bubble sort does &lt;b&gt;${fmt(ratio)}× more work&lt;/b&gt;.`;
  }
  document.getElementById(&quot;nSlider&quot;).oninput = updateCompare;

  build(); render(); updateCompare();
&lt;/script&gt;
&lt;script&gt;document.querySelector(&#x27;.tab[data-tab=&quot;bubbleTab&quot;]&#x27;).click();&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
